<!--
  Вставить содержимое этого файла ВНУТРЬ <div id="kb-form-slot"></div>
  во вкладке «База знаний». Стили формы самодостаточны (см. <style> внизу
  kb-form.js) и не зависят от классов admin.css, чтобы не столкнуться
  с тем, что там уже объявлено.
-->
<form id="kb-form" class="kb-form" novalidate>
  <div class="kb-field">
    <label for="kb-category">Категория</label>
    <select id="kb-category" name="category" required>
      <option value="" disabled selected>Выберите категорию</option>
      <option value="рабочее место">Рабочее место</option>
      <option value="доступы">Доступы</option>
      <option value="VPN">VPN</option>
      <option value="корпоративная почта">Корпоративная почта</option>
      <option value="Wi-Fi">Wi-Fi</option>
      <option value="программное обеспечение">Программное обеспечение</option>
      <option value="оборудование">Оборудование</option>
    </select>
  </div>

  <div class="kb-field">
    <label for="kb-title">Заголовок статьи</label>
    <input id="kb-title" name="title" type="text" required placeholder="Например: Не работает кофемашина">
  </div>

  <div class="kb-field">
    <div class="kb-field-head">
      <label>Симптомы (как пользователь опишет проблему)</label>
      <button type="button" class="kb-add" data-add="symptoms">+ Добавить</button>
    </div>
    <div id="kb-symptoms" class="kb-list"></div>
    <p class="kb-hint">Нужен хотя бы один — по этим фразам бот найдёт статью.</p>
  </div>

  <div class="kb-field">
    <div class="kb-field-head">
      <label>Шаги решения</label>
      <button type="button" class="kb-add" data-add="steps">+ Добавить шаг</button>
    </div>
    <div id="kb-steps" class="kb-list"></div>
  </div>

  <div class="kb-field">
    <label for="kb-escalate">Когда сразу звать специалиста (необязательно)</label>
    <input id="kb-escalate" name="escalate_if" type="text" placeholder="Например: аппарат искрит">
  </div>

  <p id="kb-error" class="kb-error" role="alert" hidden></p>
  <p id="kb-success" class="kb-success" role="status" hidden></p>

  <div class="kb-actions">
    <button type="submit" id="kb-submit" class="kb-submit">Добавить статью</button>
  </div>
</form>
