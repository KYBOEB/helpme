<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Помоги мне — техподдержка</title>
  <!-- Никаких CDN: только локальные файлы -->
  <link rel="stylesheet" href="/static/style.css">
  <!-- Не type="module": модули не грузятся при открытии через file:// -->
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app">

    <!-- Шапка: название; в диалоге слева появляется кнопка «На главную» -->
    <header class="header">
      <button id="back-btn" class="back-btn" type="button" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>На главную</span>
      </button>
      <div class="header-brand">
        <h1 class="header-title">Помоги мне</h1>
        <p class="header-subtitle">Виртуальный помощник техподдержки</p>
      </div>
    </header>

    <!-- Этап 4: здесь появится полоса «У вас есть незавершённое обращение» (4.7) -->

    <!-- Прокручиваемая область -->
    <main id="chat" class="chat">

      <!-- Главный экран: логотип, приветствие, поле ввода по центру, частые проблемы -->
      <section id="empty" class="empty">
        <div class="empty-inner">
          <!-- Плашка с логотипом компании.
               ЛОГОТИП: файл кладётся в static/img/aktion-logo.png.
               Если папка или имя файла другие — поменяйте src в строке ниже. -->
          <div class="hero-logo">
            <img src="/static/img/aktion-logo.png" alt="Актион" width="509" height="71">
          </div>
          <h2 class="empty-title">Здравствуйте! Что случилось?</h2>
          <p class="empty-text">Опишите проблему своими словами — помощник подберёт решение.</p>

          <!-- Сюда встаёт поле ввода на главном экране. В диалоге app.js переносит его вниз, в #dock -->
          <div id="hero-slot" class="hero-slot">
            <div id="composer" class="composer">
              <div class="composer-box">
                <label for="input" class="visually-hidden">Опишите проблему</label>
                <textarea id="input" rows="1" placeholder="Опишите проблему…" autocomplete="off"></textarea>
                <span id="counter" class="counter" hidden aria-live="polite"></span>
                <button id="send-btn" class="send-btn" type="button" aria-label="Отправить" disabled>
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
                  </svg>
                </button>
              </div>
              <p class="composer-hint">Enter — отправить, Shift+Enter — новая строка</p>
            </div>
          </div>

          <p class="examples-title">Или выберите частую проблему:</p>
          <div class="examples">
            <button type="button" class="example" data-example="Не подключается VPN">
              <span class="example-icon" aria-hidden="true">🔒</span>Не подключается VPN
            </button>
            <button type="button" class="example" data-example="Не могу подключиться к корпоративному Wi-Fi">
              <span class="example-icon" aria-hidden="true">📶</span>Не подключается Wi-Fi
            </button>
            <button type="button" class="example" data-example="Не печатает принтер">
              <span class="example-icon" aria-hidden="true">🖨️</span>Не печатает принтер
            </button>
            <button type="button" class="example" data-action="other">
              <span class="example-icon" aria-hidden="true">💬</span>Другая проблема
            </button>
          </div>
        </div>
      </section>

      <!-- Лента сообщений -->
      <div id="feed" class="feed" role="log" aria-live="polite" aria-label="Диалог с помощником"></div>
    </main>

    <!-- Нижняя панель: сюда переезжает поле ввода, когда начался диалог -->
    <footer id="dock" class="dock" hidden></footer>

  </div>
</body>
</html>
