<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Помоги мне — техподдержка</title>
  <!-- Никаких CDN: только локальные файлы -->
  <!-- Пути АБСОЛЮТНЫЕ. Страница отдаётся по адресу «/», поэтому относительный
       "app.js" браузер запросил бы как /app.js и получил бы 404 — чат не
       загрузился бы вовсе. Версия обязательна: без неё браузер отдаёт старый
       файл из кэша, и это выглядит как «всё сломалось». -->
  <link rel="stylesheet" href="/static/style.css?v=16">
  <!-- Не type="module": модули не грузятся при открытии через file:// -->
  <script src="/static/app.js?v=14" defer></script>
</head>
<body>
  <div class="app" data-screen="home">
    <!-- page-shell — обёртка над всем «обычным» содержимым сайта. При
         открытии краевой панели именно её, а не .app, сдвигаем в сторону
         (F2 из последней правки): подложка/вкладки/панели лежат СНАРУЖИ
         этой обёртки, поэтому transform на ней их не задевает — они всё
         так же position:fixed относительно окна, а не .page-shell. -->
    <div class="page-shell" id="page-shell">

    <!-- Шапка: название; слева в диалоге появляется кнопка «на главную»,
         справа — «Специалист» (F4). «История обращений» и «Поиск по базе
         знаний» — теперь отдельные краевые вкладки внизу файла, не в шапке. -->
    <header class="header">
      <div class="header-inner">
        <!-- Левая группа: знак компании-заказчика, подпись сервиса (только
             на главной — см. .app[data-screen="chat"] .header-tagline) и
             кнопка «на главную» (только в диалоге). Собраны в одну группу
             flex:1, чтобы .header-brand по центру оставался по-настоящему
             центрированным независимо от того, сколько занимает эта группа
             и группа .header-actions справа — классическая раскладка шапки
             «край / центр / край» на двух одинаковых по правилам flex:1. -->
        <div class="header-left">
          <!-- Знак компании-заказчика. Раньше плашка с логотипом стояла в центре
               главного экрана НАД названием продукта — то есть компания читалась
               как название сайта, а продукт как подпись к ней. Логотип заказчика
               принадлежит шапке слева; центр экрана остаётся продукту. Части
               логотипа те же самые (анимация уголков сохранена). -->
          <div class="header-logo" role="img" aria-label="Актион">
            <img class="logo-piece logo-piece--left" src="/static/img/logo-left.png" alt="" aria-hidden="true">
            <img class="logo-piece logo-piece--mid" src="/static/img/logo-mid.png" alt="" aria-hidden="true">
            <img class="logo-piece logo-piece--right" src="/static/img/logo-right.png" alt="" aria-hidden="true">
          </div>
          <!-- Описание сервиса стоит рядом с логотипом, а не в герое: в герое
               оно соседствовало с «Опишите проблему своими словами», и две
               подписи подряд под названием выглядели как недоделка. -->
          <p class="header-tagline">Виртуальный помощник техподдержки</p>
          <button id="back-btn" class="back-btn" type="button" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 18-6-6 6-6"/>
            </svg>
            <!-- Класс header-btn-label общий с кнопкой «Специалист»: на телефоне
                 текст прячется у обеих одинаково, остаётся только круглая
                 иконка того же размера — см. правило для .back-btn ниже. -->
            <span class="header-btn-label">На главную</span>
          </button>
        </div>

        <!-- Центр: название продукта и, в диалоге, номер обращения рядом
             с ним — раньше номер стоял отдельным элементом у правого края
             и никак не читался как одно целое с названием. -->
        <div class="header-brand">
          <h1 class="header-title">Помоги мне</h1>
          <!-- В диалоге подпись убрана намеренно (по просьбе): в шапке
               одновременно «На главную», центр и «Специалист» — с ней
               становится тесно, да и продублирует .header-tagline рядом
               с логотипом, если тот вернуть в диалог. -->
          <p class="header-subtitle">Виртуальный помощник техподдержки</p>
          <!-- Номер обращения появляется здесь в момент создания обращения. -->
          <span id="header-ticket" class="header-ticket" hidden></span>
        </div>

        <div class="header-actions">
          <!-- F4: видна всегда, пока обращение не закрыто -->
          <button id="specialist-btn" class="header-btn" type="button" hidden>
            <span aria-hidden="true">🧑‍💼</span>
            <span class="header-btn-label">Специалист</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Полоса восстановления: показывается, если в браузере осталось
         незавершённое обращение. Скрыта, пока app.js её не покажет. -->
    <div id="resume" class="resume" hidden>
      <p class="resume-text">У вас есть незавершённое обращение</p>
      <div class="resume-actions">
        <button id="resume-continue" class="btn btn--primary" type="button">Продолжить</button>
        <button id="resume-new" class="btn btn--ghost" type="button">Начать новое</button>
      </div>
    </div>

    <!-- Прокручиваемая область: главный экран или лента диалога — один
         из двух за раз, переключает app.js. -->
    <main id="chat" class="chat">

      <!-- Главный экран: логотип, приветствие, поле ввода, каталог категорий -->
      <section id="empty" class="empty">
        <div class="empty-inner">
          <!-- Порядок: сначала имя продукта, под ним — что это такое.
               Логотип «Актион» переехал в шапку слева (см. .header-logo):
               логотип компании-заказчика — это знак принадлежности, а не
               заголовок страницы. В шапке название продукта на главной
               скрыто (.app[data-screen="home"] .header-brand), чтобы
               «Помоги мне» не читалось дважды. -->
          <h1 class="empty-title">Помоги мне</h1>
          <p class="empty-text">Опишите проблему своими словами</p>

          <!-- Сюда встаёт поле ввода на главном экране. В диалоге app.js переносит его вниз, в #dock -->
          <div id="hero-slot" class="hero-slot">
            <div id="composer" class="composer">
              <div class="composer-box">
                <label for="input" class="visually-hidden">Опишите проблему</label>
                <textarea id="input" rows="1" placeholder="Опишите проблему…" autocomplete="off"></textarea>
                <span id="counter" class="counter" hidden aria-live="polite"></span>
                <button id="send-btn" class="send-btn" type="button" aria-label="Отправить" disabled>
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <!-- F1: категории каталога услуг, прямоугольные плитки в 2 колонки —
               иконка, название и пример вопроса. Клик подставляет пример
               в поле ввода, не отправляет сразу. -->
          <p class="catalog-title">Частые категории:</p>
          <div class="catalog">
            <button type="button" class="catalog-tile" data-fill="Нужен доступ к сетевой папке отдела">
              <span class="catalog-icon" aria-hidden="true">🔑</span>
              <span class="catalog-text">
                <span class="catalog-name">Доступы</span>
                <span class="catalog-example">Нужен доступ к папке</span>
              </span>
            </button>
            <button type="button" class="catalog-tile" data-fill="Не подключается корпоративный VPN">
              <span class="catalog-icon" aria-hidden="true">🔒</span>
              <span class="catalog-text">
                <span class="catalog-name">VPN</span>
                <span class="catalog-example">Не подключается VPN</span>
              </span>
            </button>
            <button type="button" class="catalog-tile" data-fill="Не подключается к корпоративному Wi-Fi">
              <span class="catalog-icon" aria-hidden="true">📶</span>
              <span class="catalog-text">
                <span class="catalog-name">Wi-Fi</span>
                <span class="catalog-example">Не подключается Wi-Fi</span>
              </span>
            </button>
            <button type="button" class="catalog-tile" data-fill="Не печатает принтер">
              <span class="catalog-icon" aria-hidden="true">🖨️</span>
              <span class="catalog-text">
                <span class="catalog-name">Оборудование</span>
                <span class="catalog-example">Не печатает принтер</span>
              </span>
            </button>
          </div>
        </div>
      </section>

      <!-- Лента сообщений -->
      <div id="feed" class="feed" role="log" aria-live="polite" aria-label="Диалог с помощником" hidden></div>
    </main>

    <!-- Нижняя панель: сюда переезжает поле ввода, когда начался диалог -->
    <footer id="dock" class="dock" hidden></footer>

    </div>

    <!-- Краевые вкладки: «История обращений» слева, «Поиск по базе знаний»
         справа. Видны всегда (и на главной, и в диалоге). Клик выдвигает
         панель с той же стороны, прячет обе вкладки и сдвигает page-shell
         в сторону — так фон не перекрывается криво, а просто отъезжает.
         Вернуться к работе с остальным сайтом можно только закрыв панель
         крестиком сбоку. -->
    <button class="edge-tab edge-tab--left" id="edge-tab-history" type="button">
      <span class="edge-tab-label">История обращений</span>
      <!-- Короткая подпись для телефона: там вкладки превращаются в нижнюю
           панель, и длинный текст в неё не помещается. -->
      <span class="edge-tab-short">Обращения</span>
    </button>
    <button class="edge-tab edge-tab--right" id="edge-tab-search" type="button">
      <span class="edge-tab-label">Поиск по базе знаний</span>
      <span class="edge-tab-short">База знаний</span>
    </button>

    <!-- Клик по подложке закрывает панель. -->
    <div class="edge-backdrop" id="edge-backdrop" aria-hidden="true"></div>

    <aside class="edge-panel edge-panel--left" id="panel-history" aria-label="История обращений" tabindex="-1">
      <!-- Заголовок и крестик — одна строка (.edge-panel-head). Порядок в
           разметке: сначала заголовок, потом кнопка — так и по вёрстке,
           и по порядку обхода с клавиатуры. -->
      <div class="edge-panel-head">
        <h3 class="edge-panel-title">История обращений</h3>
        <button class="edge-panel-close" id="panel-history-close" type="button" aria-label="Закрыть">×</button>
      </div>
      <div id="panel-history-body"></div>
    </aside>

    <aside class="edge-panel edge-panel--right" id="panel-search" aria-label="Поиск по базе знаний" tabindex="-1">
      <div class="edge-panel-head">
        <h3 class="edge-panel-title">Поиск по базе знаний</h3>
        <button class="edge-panel-close" id="panel-search-close" type="button" aria-label="Закрыть">×</button>
      </div>
      <label for="kb-search-input" class="visually-hidden">Поиск по базе знаний</label>
      <div class="kb-search-box">
        <span class="kb-search-icon" aria-hidden="true">🔎</span>
        <input id="kb-search-input" type="text" placeholder="Поиск по базе знаний…" autocomplete="off">
      </div>
      <ul id="kb-search-results" class="kb-search-results" hidden></ul>
    </aside>

  </div>
</body>
</html>
