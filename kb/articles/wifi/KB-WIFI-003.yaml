id: KB-WIFI-003
category: Wi-Fi
title: Устройство просит пароль от Wi-Fi повторно
symptoms:
  - "постоянно просит пароль от wifi"
  - "каждый раз ввожу пароль заново"
  - "телефон не запоминает пароль wifi"
  - "вифи сбрасывает пароль"
  - "не сохраняется пароль от корпоративной сети"
steps:
  - "Удалите сохранённую сеть corp-wifi в настройках Wi-Fi"
  - "Подключитесь заново, внимательно вводя логин и пароль"
  - "Убедитесь, что раскладка клавиатуры английская и Caps Lock выключен"
  - "Проверьте, что пароль не истёк — попробуйте войти с ним в корпоративную почту"
  - "Перезагрузите устройство и подключитесь ещё раз"
escalate_if: "пароль снова не принимается после повторного ввода"