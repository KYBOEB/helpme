id: KB-WIFI-003
category: Wi-Fi
title: Устройство просит пароль от Wi-Fi повторно
symptoms:
  - "постоянно просит пароль от wifi"
  - "каждый раз ввожу пароль заново"
  - "телефон не запоминает пароль wifi"
  - "вифи сбрасывает пароль"
  - "не сохраняется пароль от корпоративной сети"
steps:
  - "Откройте настройки Wi-Fi, выберите сохранённую сеть «corp-wifi» и нажмите «Забыть сеть», чтобы удалить сохранённые для неё данные подключения."
  - "В списке доступных сетей выберите «corp-wifi», введите корпоративный логин и пароль и дождитесь сообщения об успешном подключении."
  - "Проверьте раскладку клавиатуры и выключите Caps Lock перед вводом данных в окне подключения к Wi-Fi, чтобы логин и пароль не изменились из-за неверного регистра."
  - "Откройте страницу входа в корпоративную почту и войдите с тем же паролем, чтобы проверить, не истёк ли он."
  - "Перезагрузите устройство через меню питания и после запуска снова выберите сеть «corp-wifi», чтобы проверить, сохраняется ли подключение."
escalate_if: "Обратитесь в техподдержку, если сеть снова запрашивает пароль после правильного ввода и перезагрузки устройства."
