id: KB-WIFI-013
category: Wi-Fi
title: Устройство не видит сеть на 5 ГГц
symptoms:
  - "не вижу сеть 5 гигагерц"
  - "только медленная сеть видна"
  - "wifi 5ghz отсутствует в списке"
required_slots:
  - key: device
    question: "О каком устройстве речь?"
    options: ["Рабочий компьютер", "Ноутбук", "Телефон", "Планшет"]
steps:
  - "Откройте настройки Wi-Fi на устройстве и обновите список доступных сетей, чтобы проверить, появилась ли сеть с частотой 5 ГГц."
  - "Подойдите ближе к месту установки точки доступа и снова откройте список Wi-Fi, потому что сеть 5 ГГц обычно имеет меньший радиус действия и после этого может появиться."
  - "Откройте сведения о Wi-Fi-адаптере в настройках устройства и найдите поддерживаемые стандарты или диапазоны, чтобы проверить, умеет ли устройство работать на частоте 5 ГГц."
  - "Подключитесь к этой же Wi-Fi-сети другим устройством в том же месте, и если на нём сеть 5 ГГц видна, проблема, вероятно, связана с адаптером или настройками первого устройства."
escalate_if: "Обратитесь в техподдержку, если устройство поддерживает 5 ГГц, но сеть не появляется даже рядом с точкой доступа."
