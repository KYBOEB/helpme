id: KB-WIFI-010
category: Wi-Fi
title: Wi-Fi работает на телефоне, но не на ноутбуке
symptoms:
  - "на телефоне вайфай есть а на ноуте нет"
  - "ноутбук не подключается, другие устройства работают"
  - "только на компьютере не работает wifi"
steps:
  - "Откройте панель быстрых настроек ноутбука и убедитесь, что режим «В самолёте» выключен, а Wi‑Fi включён — список доступных сетей должен появиться рядом со значком сети."
  - "В настройках Wi‑Fi выберите нужную сеть и нажмите «Подключиться» — ноутбук покажет запрос пароля или состояние «Подключено»."
  - "В списке сохранённых сетей откройте параметры нужной сети и выберите «Забыть», после чего подключитесь к ней заново — система повторно запросит пароль и сохранит новое подключение."
  - "Перезагрузите ноутбук через меню «Пуск» или меню Apple — после запуска проверьте, подключается ли он к той же сети."
  - "Запустите средство устранения неполадок сети в настройках ноутбука — система покажет найденную проблему с Wi‑Fi или предложит исправление."
escalate_if: "Обратитесь в техподдержку, если телефон подключается к этой сети, а ноутбук не видит её или не подключается после повторного ввода пароля."
