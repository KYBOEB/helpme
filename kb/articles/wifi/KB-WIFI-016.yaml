id: KB-WIFI-016
category: Wi-Fi
title: Нужен Wi-Fi для подрядчика или гостя мероприятия
symptoms:
  - "нужен интернет для гостей"
  - "приехали подрядчики, нужен вайфай"
  - "как дать доступ к сети постороннему"
steps:
  - "Попросите гостя открыть список доступных сетей на телефоне или компьютере и подключиться к сети с названием для гостей, если она отображается, после чего устройство должно показать страницу входа или запрос данных доступа."
  - "Не передавайте гостю свой личный пароль от университетской сети, а уточните у организатора мероприятия или ответственного сотрудника, как оформить гостевой доступ, после чего вам сообщат безопасный способ подключения."
  - "Проверьте на странице входа гостевой сети, что гость принял условия использования и завершил вход, после чего сайты должны открываться без подключения к вашей рабочей учётной записи."
escalate_if: "Обратитесь в техподдержку, если гостевая сеть не отображается, страница входа не открывается или доступ требуется на определённый срок."
