id: KB-WIFI-014
category: Wi-Fi
title: Wi-Fi подключается, но скорость очень низкая в конкретном кабинете
symptoms:
  - "в этом кабинете вайфай еле шевелится"
  - "скорость упала только в одной аудитории"
  - "wifi медленный в определённом месте"
steps:
  - "В проблемном кабинете откройте любой привычный сервис проверки скорости и запишите полученные значения, чтобы сравнить их с результатом в другом месте."
  - "Подойдите ближе к окну или к центру кабинета и повторите проверку скорости, чтобы понять, меняется ли качество сигнала в разных местах."
  - "Откройте список Wi-Fi на устройстве, отключитесь от текущей сети и подключитесь к ней снова, после чего повторите проверку скорости."
  - "Временно приостановите загрузки, видеозвонки и потоковое видео на устройстве, чтобы проверить скорость без приложений, использующих канал."
  - "Проверьте скорость в этом же кабинете в другое время, чтобы определить, связана ли проблема с нагрузкой на сеть."
escalate_if: "Обратитесь в техподдержку и укажите кабинет, время проверки, место в кабинете и полученные значения скорости, если проблема сохраняется."
