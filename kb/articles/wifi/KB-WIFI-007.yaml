id: KB-WIFI-007
category: Wi-Fi
title: Wi-Fi требует сертификат при подключении
symptoms:
  - "вайфай просит сертификат"
  - "wifi требует подтвердить сертификат"
  - "выскакивает окно про сертификат сети"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте список доступных сетей Wi-Fi и отмените окно с сертификатом, чтобы устройство не подключалось к сети с непроверенными данными."
  - "Проверьте название сети в списке Wi-Fi и выберите именно ту сеть, которой вы обычно пользуетесь, после чего появится запрос на подключение к выбранной сети."
  - "В окне сертификата откройте «Подробнее» или «Сведения» и проверьте имя сети и издателя сертификата, чтобы убедиться, что они соответствуют вашей организации."
  - "В настройках Wi-Fi выберите сохранённую сеть, нажмите «Забыть» или «Удалить» и подключитесь к ней заново, после чего запрос сертификата появится повторно для проверки."
escalate_if: "Обратитесь в техподдержку, если данные сертификата нельзя проверить или устройство продолжает показывать непонятный сертификат."
