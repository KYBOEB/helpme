id: KB-WIFI-004
category: Wi-Fi
title: Устройство не видит сеть corp-wifi
symptoms:
  - "не вижу сеть corp-wifi"
  - "пропала корпоративная сеть вайфай"
  - "в списке wifi нет corp-wifi"
  - "вифи сеть исчезла"
  - "телефон не находит корпоративный wifi"
  - "нет доступных сетей wifi"
  - "вифи отвалился"
  - "вайфай пропал из списка"
  - "пропадает сеть wifi"
required_slots:
  - key: device
    question: "На каком устройстве не видно сеть?"
    options: ["Windows-ноутбук", "macOS-ноутбук", "Смартфон", "Планшет"]
steps:
  - "Откройте настройки Wi‑Fi на устройстве и выключите беспроводную сеть на несколько секунд, затем включите её снова — список доступных сетей обновится, и в нём может появиться «corp-wifi»."
  - "Подойдите ближе к ближайшей точке доступа и снова откройте список доступных сетей в настройках Wi‑Fi — если сигнал был слабым, сеть «corp-wifi» появится в списке."
  - "Перезагрузите устройство через меню питания операционной системы и после входа снова откройте настройки Wi‑Fi — устройство заново выполнит поиск доступных сетей."
  - "Спросите находящихся рядом коллег, видят ли они «corp-wifi» в списке сетей на своих устройствах — так вы поймёте, проблема только у вашего устройства или сеть недоступна рядом с вами."
  - "На Windows откройте «Параметры», выберите «Сеть и Интернет» и удалите сохранённый профиль «corp-wifi» в разделе управления известными сетями, затем включите Wi‑Fi снова — сеть появится в обновлённом списке, если она доступна поблизости."
escalate_if: "Обратитесь в техподдержку, если «corp-wifi» не видна на вашем устройстве после этих действий или её одновременно не видят коллеги рядом."
