id: KB-WIFI-004
category: Wi-Fi
title: Устройство не видит сеть corp-wifi
symptoms:
  - "не вижу сеть corp-wifi"
  - "пропала корпоративная сеть вайфай"
  - "в списке wifi нет corp-wifi"
  - "вифи сеть исчезла"
  - "телефон не находит корпоративный wifi"
  - "нет доступных сетей wifi"
  - "вифи отвалился"
  - "вайфай пропал из списка"
  - "пропадает сеть wifi"
required_slots:
  - key: device
    question: "На каком устройстве не видно сеть?"
    options: ["Windows-ноутбук", "macOS-ноутбук", "Смартфон", "Планшет"]
steps:
  - "Включите и выключите Wi-Fi на устройстве"
  - "Отойдите ближе к точке доступа — проверьте, появилась ли сеть"
  - "Перезагрузите устройство"
  - "Проверьте, видят ли сеть corp-wifi коллеги рядом"
  - "На Windows: удалите профиль сети и включите Wi-Fi заново"
escalate_if: "сеть corp-wifi не видна ни на одном устройстве в помещении"