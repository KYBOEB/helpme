id: KB-WIFI-015
category: Wi-Fi
title: Устройство само подключается к чужой сети
symptoms:
  - "ноут цепляется к соседнему вайфаю"
  - "подключается не к той сети"
  - "wifi выбирает чужую точку"
required_slots:
  - key: device
    question: "О каком устройстве речь?"
    options: ["Рабочий компьютер", "Ноутбук", "Телефон", "Планшет"]
steps:
  - "Откройте список Wi-Fi на устройстве и выберите нужную сеть вручную, чтобы проверить, подключается ли устройство к ней без выбора чужой точки."
  - "Откройте свойства чужой сети в настройках Wi-Fi и отключите параметр «Подключаться автоматически», чтобы устройство перестало выбирать её при обнаружении."
  - "В настройках Wi-Fi выберите чужую сеть и нажмите «Забыть», после чего она исчезнет из сохранённых подключений и не будет подключаться по старому правилу."
  - "Откройте свойства нужной сети и включите параметр «Подключаться автоматически», чтобы устройство предпочитало её при доступности."
  - "Перезапустите Wi-Fi в настройках устройства и проверьте список подключений, чтобы убедиться, что устройство выбирает нужную сеть."
escalate_if: "Обратитесь в техподдержку, если устройство продолжает подключаться к чужой сети после отключения автоматического подключения и удаления её из сохранённых сетей."
