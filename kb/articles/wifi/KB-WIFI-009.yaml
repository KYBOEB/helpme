id: KB-WIFI-009
category: Wi-Fi
title: Wi-Fi пропадает при переходе между кабинетами
symptoms:
  - "в коридоре вайфай отваливается"
  - "перехожу в другую аудиторию и связь рвётся"
  - "wifi теряется при перемещении"
steps:
  - "В настройках Wi‑Fi включите параметр «Подключаться автоматически» для нужной сети — устройство сможет самостоятельно возвращаться к доступной точке доступа после перехода в другую аудиторию."
  - "Находясь в месте, где связь пропадает, откройте список сетей Wi‑Fi и проверьте, видна ли университетская сеть — это покажет, теряется ли сигнал полностью или не выполняется переподключение."
  - "Переключите Wi‑Fi на устройстве через панель быстрых настроек — список доступных сетей обновится, и подключение может восстановиться без перезагрузки."
  - "Установите доступные обновления операционной системы в разделе «Центр обновления» или «Обновление ПО» — вместе с ними могут обновиться компоненты, отвечающие за работу Wi‑Fi."
escalate_if: "Обратитесь в техподдержку, если связь регулярно пропадает в одних и тех же местах или не восстанавливается после возвращения в зону уверенного сигнала."
