id: KB-WIFI-002
category: Wi-Fi
title: Wi-Fi подключён, но интернета нет
symptoms:
  - "вайфай подключен а интернета нет"
  - "wifi без доступа к интернету"
  - "подключено без интернета"
  - "вифи есть а сайты не грузятся"
  - "сеть есть интернета нет"
steps:
  - "Откройте на устройстве любой сайт — проверьте, что страница не открывается"
  - "Отключите Wi-Fi и подключитесь к мобильному интернету — если сайты открываются, проблема в сети"
  - "Отключите VPN, если он запущен"
  - "Забудьте сеть corp-wifi и подключитесь заново"
  - "Перезагрузите устройство"
escalate_if: "интернет не появился ни на одном устройстве в этой сети"