id: KB-WIFI-002
category: Wi-Fi
title: Wi-Fi подключён, но интернета нет
symptoms:
  - "вайфай подключен а интернета нет"
  - "wifi без доступа к интернету"
  - "подключено без интернета"
  - "вифи есть а сайты не грузятся"
  - "сеть есть интернета нет"
steps:
  - "Откройте в браузере любой сайт и попробуйте обновить страницу, чтобы подтвердить, что при подключённом Wi-Fi интернет действительно не работает."
  - "Отключите Wi-Fi в настройках беспроводных подключений и включите мобильный интернет, после чего проверьте открытие сайтов и сравните результат."
  - "Откройте запущенную программу VPN и нажмите «Отключить» или «Завершить подключение», после чего снова проверьте сайты через Wi-Fi."
  - "Откройте настройки Wi-Fi, выберите сеть «corp-wifi» и нажмите «Забыть сеть», затем подключитесь к ней заново и проверьте доступ в интернет."
  - "Перезагрузите устройство через меню питания и после запуска снова подключитесь к сети «corp-wifi», чтобы проверить, восстановился ли доступ."
escalate_if: "Обратитесь в техподдержку, если сайты не открываются после повторного подключения к «corp-wifi», но через мобильный интернет работают."
