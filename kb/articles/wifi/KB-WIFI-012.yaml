id: KB-WIFI-012
category: Wi-Fi
title: Wi-Fi перестал работать после смены пароля учётной записи
symptoms:
  - "сменил пароль и вайфай отвалился"
  - "wifi не принимает новый пароль"
  - "после смены пароля сеть не подключается"
steps:
  - "Откройте список Wi-Fi на компьютере или телефоне, выберите университетскую сеть и нажмите «Отключиться», а затем подключитесь к ней снова, чтобы проверить, появится ли запрос на новый пароль."
  - "Откройте настройки Wi-Fi, выберите сохранённую университетскую сеть и нажмите «Забыть», после чего сеть исчезнет из сохранённых подключений и её можно будет добавить заново."
  - "В списке доступных сетей выберите университетскую сеть, введите новый пароль учётной записи и нажмите «Подключиться», чтобы устройство сохранило обновлённые данные."
  - "На странице входа в корпоративную учётную запись проверьте новый пароль, и если он не принимается там, подключение к Wi-Fi также не восстановится."
escalate_if: "Обратитесь в техподдержку, если новый пароль принимается на странице входа, но Wi-Fi не подключается после повторного добавления сети."
