id: KB-WIFI-008
category: Wi-Fi
title: Ошибка «не удалось получить IP-адрес»
symptoms:
  - "не получает ip адрес"
  - "вайфай пишет ошибка получения адреса"
  - "подключение зависает на получении адреса"
required_slots:
  - key: device
    question: "О каком устройстве речь?"
    options: ["Рабочий компьютер", "Ноутбук", "Телефон", "Планшет"]
steps:
  - "Откройте список сетей Wi-Fi на устройстве, отключитесь от нужной сети и подключитесь к ней снова, после чего устройство повторит получение IP-адреса."
  - "Выключите Wi-Fi в настройках устройства и включите его через несколько секунд, после чего список сетей обновится и подключение начнётся заново."
  - "Перезагрузите устройство через обычную команду «Перезагрузка», после чего попробуйте подключиться к Wi-Fi ещё раз."
  - "В настройках Wi-Fi выберите проблемную сеть, нажмите «Забыть» или «Удалить» и подключитесь к ней заново с паролем, после чего устройство запросит новый IP-адрес."
  - "Подключите устройство к другой доступной сети Wi-Fi в списке сетей, чтобы проверить, возникает ли ошибка только в исходной сети."
escalate_if: "Обратитесь в техподдержку, если устройство не получает IP-адрес ни в одной доступной сети."
