id: KB-WIFI-006
category: Wi-Fi
title: Не подключается к гостевой сети
symptoms:
  - "гостевой вайфай не пускает"
  - "guest wifi не подключается"
  - "нужен вайфай для гостя"
required_slots:
  - key: device
    question: "О каком устройстве речь?"
    options: ["Рабочий компьютер", "Ноутбук", "Телефон", "Планшет"]
steps:
  - "Откройте настройки Wi-Fi на устройстве и выберите гостевую сеть из списка доступных сетей — устройство должно показать запрос на подключение или поле для пароля."
  - "Подключитесь к гостевой сети и откройте браузер — должна появиться страница входа, принятия условий или ввода пароля."
  - "Выполните указания на странице входа в гостевую сеть — после подтверждения обычные сайты должны открываться."
  - "Если страница входа не появилась, отключите Wi-Fi и включите его снова в настройках устройства — после повторного подключения запрос на вход может появиться автоматически."
  - "Если сеть сохранена с неверными данными, откройте сведения об этой сети в настройках Wi-Fi, выберите «Забыть эту сеть» и подключитесь к ней заново — устройство попросит ввести пароль или подтвердить вход ещё раз."
escalate_if: "Обратитесь в техподдержку, если гостевая сеть не отображается или не подключается после повторного входа."
