id: KB-WIFI-011
category: Wi-Fi
title: Wi-Fi отключается после выхода из спящего режима
symptoms:
  - "после сна вайфай не включается"
  - "открываю крышку и сети нет"
  - "wifi не восстанавливается после сна"
steps:
  - "Откройте панель быстрых настроек после выхода устройства из сна и переключите Wi‑Fi — список доступных сетей обновится, и подключение может восстановиться."
  - "В настройках Wi‑Fi выберите нужную сеть и нажмите «Подключиться» — устройство должно показать состояние «Подключено»."
  - "Перезагрузите устройство через меню питания операционной системы — после запуска проверьте, восстанавливается ли Wi‑Fi после следующего выхода из сна."
  - "Установите доступные обновления операционной системы в разделе «Центр обновления» или «Обновление ПО» — это может исправить восстановление сетевого адаптера после сна."
escalate_if: "Обратитесь в техподдержку, если Wi‑Fi отключается после каждого выхода из сна даже после перезагрузки и установки обновлений."
