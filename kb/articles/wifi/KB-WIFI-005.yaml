id: KB-WIFI-005
category: Wi-Fi
title: Wi-Fi работает очень медленно
symptoms:
  - "wifi медленно работает"
  - "интернет тормозит по вайфаю"
  - "вифи еле грузит"
  - "медленная корпоративная сеть"
  - "страницы по wifi грузятся долго"
required_slots:
  - key: where
    question: "Где заметили проблему со скоростью?"
    options: ["Только у себя", "У нескольких коллег рядом", "По всему офису"]
steps:
  - "Откройте любой сервис проверки скорости в браузере и запустите измерение при подключении к Wi-Fi — на экране появятся значения скорости загрузки и отдачи."
  - "Откройте приложение VPN и отключите активное подключение — после этого повторная проверка покажет, влияет ли VPN на скорость."
  - "Подключите устройство к сети по кабелю через доступный сетевой порт и снова измерьте скорость — сравнение покажет, медленный ли Wi-Fi или само интернет-подключение."
  - "Если у вас есть доступ к роутеру или точке доступа, отключите его кнопкой питания и включите снова через несколько секунд — после запуска сеть восстановится и можно будет повторить проверку."
  - "Переместите устройство подальше от металлических конструкций и работающей микроволновой печи — уровень сигнала Wi-Fi может улучшиться."
escalate_if: "Обратитесь в техподдержку, если скорость остаётся низкой на разных устройствах и при подключении по кабелю."
