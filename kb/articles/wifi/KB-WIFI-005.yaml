id: KB-WIFI-005
category: Wi-Fi
title: Wi-Fi работает очень медленно
symptoms:
  - "wifi медленно работает"
  - "интернет тормозит по вайфаю"
  - "вифи еле грузит"
  - "медленная корпоративная сеть"
  - "страницы по wifi грузятся долго"
required_slots:
  - key: where
    question: "Где заметили проблему со скоростью?"
    options: ["Только у себя", "У нескольких коллег рядом", "По всему офису"]
steps:
  - "Проверьте скорость через любой сервис замера скорости"
  - "Отключите VPN, если он запущен — он может снижать скорость"
  - "Подключитесь по кабелю и сравните результат"
  - "Перезагрузите роутер или точку доступа, если есть доступ"
  - "Отойдите от металлических конструкций и микроволновки — они мешают сигналу"
escalate_if: "скорость низкая у нескольких сотрудников в одном помещении"