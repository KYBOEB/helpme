id: KB-WIFI-001
category: Wi-Fi
title: Не подключается к корпоративной сети corp-wifi
symptoms:
  - "не подключается к corp-wifi"
  - "вифи не работает"
  - "не могу подключиться к корпоративному вайфаю"
  - "корп вайфай не коннектится"
  - "wifi пишет не удалось подключиться"
required_slots:
  - key: device
    question: "На каком устройстве пытаетесь подключиться?"
    options: ["Windows-ноутбук", "macOS-ноутбук", "Смартфон Android", "iPhone"]
steps:
  - "Убедитесь, что Wi-Fi на устройстве включён и вы видите сеть corp-wifi в списке"
  - "Забудьте сеть corp-wifi в настройках Wi-Fi и подключитесь заново"
  - "Введите логин в формате домен\\логин и пароль от учётной записи"
  - "Если просит сертификат — выберите «Доверять» и укажите профиль corp"
  - "Перезагрузите устройство и повторите подключение"
escalate_if: "после переподключения сеть corp-wifi по-прежнему недоступна"