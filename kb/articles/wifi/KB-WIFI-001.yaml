id: KB-WIFI-001
category: Wi-Fi
title: Не подключается к корпоративной сети corp-wifi
symptoms:
  - "не подключается к corp-wifi"
  - "вифи не работает"
  - "не могу подключиться к корпоративному вайфаю"
  - "корп вайфай не коннектится"
  - "wifi пишет не удалось подключиться"
required_slots:
  - key: device
    question: "На каком устройстве пытаетесь подключиться?"
    options: ["Windows-ноутбук", "macOS-ноутбук", "Смартфон Android", "iPhone"]
steps:
  - "Откройте настройки Wi-Fi на устройстве и включите беспроводную сеть — в списке доступных сетей должна появиться сеть corp-wifi."
  - "Откройте сведения о сети corp-wifi в настройках Wi-Fi, выберите «Забыть сеть» и подтвердите действие — сеть исчезнет из сохранённых подключений."
  - "Снова выберите corp-wifi в списке Wi-Fi и начните подключение — устройство покажет поля для учётных данных."
  - "Введите логин в формате домен\\логин и пароль от корпоративной учётной записи в окне подключения — после подтверждения устройство начнёт проверять данные."
  - "Если устройство запросит сертификат, выберите «Доверять» и укажите профиль corp в окне проверки — подключение к corp-wifi завершится, если данные верны."
  - "Перезагрузите устройство через системное меню питания и снова выберите corp-wifi в настройках Wi-Fi — устройство повторит попытку подключения к сети."
escalate_if: "Обратитесь в техподдержку, если сеть corp-wifi видна, но устройство отклоняет учётные данные или сертификат."
