id: KB-HW-001
category: оборудование
title: Принтер не печатает
symptoms:
  - "принтер не печатает"
  - "принтер не пичатает"
  - "не могу распечатать документ"
  - "принтер не реагирует"
  - "задание на печать зависло"
required_slots:
  - key: connection
    question: "Как подключён принтер?"
    options: ["По сети", "По USB", "По Wi-Fi"]
steps:
  - "Посмотрите на принтер и его панель управления — устройство должно быть включено, подключено и не показывать сообщение об ошибке."
  - "Проверьте лоток для бумаги и индикатор тонера на принтере — в устройстве должны быть бумага и достаточный запас тонера."
  - "Откройте очередь печати через «Параметры» Windows, выберите «Bluetooth и устройства», затем «Принтеры и сканеры» и нужный принтер — в списке заданий не должно оставаться зависших документов."
  - "Отправьте на печать тестовую страницу из окна выбранного принтера — если страница напечаталась, сам принтер работает, а проблема может быть в исходном документе или программе."
  - "Выключите и снова включите принтер кнопкой питания, дождитесь его готовности и повторите печать — новое задание должно появиться в очереди и начать выполняться."
escalate_if: "Обратитесь в техподдержку, если принтер включён, подключён и готов к работе, но тестовая страница не печатается."
