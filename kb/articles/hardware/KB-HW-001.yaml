id: KB-HW-001
category: оборудование
title: Принтер не печатает
symptoms:
  - "принтер не печатает"
  - "принтер не пичатает"
  - "не могу распечатать документ"
  - "принтер не реагирует"
  - "задание на печать зависло"
required_slots:
  - key: connection
    question: "Как подключён принтер?"
    options: ["По сети", "По USB", "По Wi-Fi"]
steps:
  - "Проверьте, что принтер включён и на нём нет ошибок"
  - "Проверьте, есть ли бумага и не закончился ли тонер"
  - "Откройте очередь печати и удалите зависшие задания"
  - "Отправьте на печать тестовую страницу"
  - "Перезагрузите принтер и повторите печать"
escalate_if: "принтер не печатает после перезагрузки и проверки бумаги"