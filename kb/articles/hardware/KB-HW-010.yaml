id: KB-HW-010
category: оборудование
title: Замятие бумаги в принтере
symptoms:
  - "зажевало бумагу"
  - "бумага застряла в принтере"
  - "принтер пишет замятие"
steps:
  - "Отмените текущую печать в очереди принтера на компьютере — новые задания перестанут поступать в устройство во время устранения замятия."
  - "Откройте доступную крышку принтера, указанную на его корпусе или экране, — вы увидите область, где может находиться застрявший лист."
  - "Медленно извлеките видимую бумагу двумя руками в направлении её обычного движения — лист должен выйти целым, без рывков и разрывов."
  - "Закройте все крышки принтера и включите его, если он был выключен, — сообщение о замятии должно исчезнуть после короткой проверки устройства."
  - "Напечатайте одну пробную страницу из окна печати — принтер должен протянуть бумагу без остановки и повторного сообщения о замятии."
escalate_if: "Обратитесь в техподдержку, если бумага не вытаскивается без усилия, порвалась внутри или сообщение о замятии не исчезает."
