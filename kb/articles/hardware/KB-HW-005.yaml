id: KB-HW-005
category: оборудование
title: Клавиатура не реагирует на нажатия
symptoms:
  - "клавиатура не работает"
  - "клава не печатает"
  - "не реагирует клавиатура"
  - "некоторые клавиши не работают"
  - "клавиатура не набирает текст"
required_slots:
  - key: type
    question: "Какая клавиатура?"
    options: ["Проводная USB", "Беспроводная", "Встроенная в ноутбук"]
steps:
  - "Проверьте кабель клавиатуры или USB-приёмник в разъёме компьютера, чтобы убедиться, что он вставлен до конца и клавиши начинают работать."
  - "Для беспроводной клавиатуры замените батарейки или подключите её к зарядке, после чего индикатор должен загореться или клавиатура снова начнёт реагировать."
  - "Переставьте USB-кабель или USB-приёмник клавиатуры в другой разъём компьютера, и система должна заново обнаружить устройство."
  - "Перезагрузите компьютер через меню «Пуск», чтобы после запуска клавиатура подключилась заново."
  - "Подключите клавиатуру к другому компьютеру и нажмите несколько клавиш, чтобы проверить, реагируют ли они там."
escalate_if: "Обратитесь в техподдержку, если клавиатура не работает на другом компьютере или не реагирует после этих проверок."
