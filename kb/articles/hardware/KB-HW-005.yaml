id: KB-HW-005
category: оборудование
title: Клавиатура не реагирует на нажатия
symptoms:
  - "клавиатура не работает"
  - "клава не печатает"
  - "не реагирует клавиатура"
  - "некоторые клавиши не работают"
  - "клавиатура не набирает текст"
required_slots:
  - key: type
    question: "Какая клавиатура?"
    options: ["Проводная USB", "Беспроводная", "Встроенная в ноутбук"]
steps:
  - "Проверьте, что клавиатура подключена к компьютеру"
  - "Для беспроводной — замените батарейки или зарядите"
  - "Переподключите USB-кабель в другой порт"
  - "Перезагрузите компьютер"
  - "Попробуйте клавиатуру на другом компьютере"
escalate_if: "клавиатура не работает даже на другом компьютере"