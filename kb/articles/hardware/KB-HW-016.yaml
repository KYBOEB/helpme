id: KB-HW-016
category: оборудование
title: Не работает док-станция
symptoms:
  - "док станция не подключает мониторы"
  - "через док не работает сеть"
  - "подключил ноут к станции, ничего нет"
steps:
  - "Проверьте, что док-станция подключена к розетке и её индикатор горит, потому что без питания мониторы и сеть через неё работать не будут."
  - "Переподключите кабель между ноутбуком и док-станцией в разъёме USB-C или Thunderbolt на ноутбуке, после чего на экране может появиться уведомление о подключении станции."
  - "Проверьте кабели мониторов и сетевой кабель в разъёмах док-станции, после чего монитор и сетевое подключение должны определиться снова."
  - "Перезапустите ноутбук через меню «Пуск» и «Питание», после чего проверьте работу мониторов и сети через док-станцию."
escalate_if: "Обратитесь в техподдержку, если док-станция не показывает изображение и не подключает сеть после этих проверок."
