id: KB-HW-006
category: оборудование
title: Ноутбук быстро разряжается
symptoms:
  - "ноутбук быстро разряжается"
  - "батарея держит мало"
  - "ноут работает от батареи 30 минут"
  - "быстро садится зарядка"
  - "аккумулятор ноутбука износился"
steps:
  - "Откройте параметры питания в настройках ноутбука и уменьшите яркость экрана или выберите экономичный режим, после чего расход заряда должен снизиться."
  - "Откройте список использования батареи в разделе «Система» или «Питание» и проверьте, какие программы расходуют больше всего заряда."
  - "Закройте ненужные программы в панели задач или диспетчере задач, после чего батарея не должна разряжаться так быстро при обычной работе."
  - "Подключите зарядное устройство к другой розетке и проверьте значок батареи в панели задач, где должно появиться состояние «Заряжается»."
  - "Перезагрузите ноутбук через меню «Пуск» и проверьте, увеличилось ли время работы от батареи после повторного включения."
escalate_if: "Обратитесь в техподдержку, если ноутбук по-прежнему работает от батареи около 30 минут или заряд не увеличивается при подключённом адаптере."
