id: KB-HW-002
category: оборудование
title: Не работает мышь
symptoms:
  - "мышь не работает"
  - "мышка не двигается"
  - "курсор не двигается"
  - "не работает тачпад"
  - "мышь не реагирует на движения"
required_slots:
  - key: type
    question: "Что именно не работает?"
    options: ["Проводная мышь", "Беспроводная мышь", "Тачпад на ноутбуке"]
steps:
  - "Проверьте кабель мыши или USB-приёмник в разъёме компьютера, чтобы убедиться, что он вставлен до конца и курсор начинает реагировать на движение."
  - "Для беспроводной мыши замените батарейки в отсеке снизу или подключите её к зарядке, после чего индикатор должен загореться или мышь снова начнёт работать."
  - "Переставьте USB-приёмник мыши в другой разъём компьютера, и система должна заново обнаружить устройство."
  - "Перезагрузите компьютер через меню «Пуск», чтобы после запуска мышь подключилась заново."
  - "Подключите мышь к другому компьютеру, и если курсор там также не двигается, неисправность, скорее всего, связана с мышью."
escalate_if: "Обратитесь в техподдержку, если мышь или тачпад не работают после этих проверок."
