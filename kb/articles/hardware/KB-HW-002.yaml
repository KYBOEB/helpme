id: KB-HW-002
category: оборудование
title: Не работает мышь
symptoms:
  - "мышь не работает"
  - "мышка не двигается"
  - "курсор не двигается"
  - "не работает тачпад"
  - "мышь не реагирует на движения"
required_slots:
  - key: type
    question: "Что именно не работает?"
    options: ["Проводная мышь", "Беспроводная мышь", "Тачпад на ноутбуке"]
steps:
  - "Проверьте, что мышь подключена к компьютеру"
  - "Для беспроводной мыши замените батарейки или зарядите её"
  - "Переподключите USB-приёмник в другой порт"
  - "Перезагрузите компьютер"
  - "Попробуйте мышь на другом компьютере — проверьте, работает ли она"
escalate_if: "мышь не работает даже на другом компьютере"