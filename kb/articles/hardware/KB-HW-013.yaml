id: KB-HW-013
category: оборудование
title: Ноутбук перегревается и шумит
symptoms:
  - "ноут греется и гудит"
  - "вентилятор воет постоянно"
  - "компьютер горячий снизу"
steps:
  - "Поставьте ноутбук на твёрдую ровную поверхность и убедитесь, что вентиляционные отверстия снизу и по бокам не закрыты, после чего шум вентилятора должен уменьшиться через несколько минут."
  - "Закройте ненужные программы и вкладки, а в «Диспетчере задач» проверьте, чтобы ни один процесс не загружал процессор постоянно на 90–100 процентов."
  - "Перезагрузите ноутбук через меню «Пуск», чтобы временная нагрузка завершилась, и после запуска проверьте, снизились ли температура корпуса и шум вентилятора."
  - "Проверьте, не появляются ли сообщения о перегреве или снижении производительности, и если они появляются снова, зафиксируйте их текст для обращения в техподдержку."
escalate_if: "Если ноутбук остаётся горячим, вентилятор постоянно работает на высокой скорости или устройство самопроизвольно выключается, обратитесь в техподдержку."
