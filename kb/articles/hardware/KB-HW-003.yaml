id: KB-HW-003
category: оборудование
title: Нет звука на компьютере
symptoms:
  - "нет звука"
  - "звук пропал"
  - "не работают колонки"
  - "наушники не слышно"
  - "звука нет на ноутбуке"
required_slots:
  - key: output
    question: "Куда должен идти звук?"
    options: ["Колонки", "Наушники", "Встроенные динамики"]
steps:
  - "Проверьте, не выключен ли звук в системе и не стоит ли mute"
  - "Проверьте, что колонки или наушники подключены и включены"
  - "Кликните по значку звука и выберите правильное устройство вывода"
  - "Перезагрузите компьютер"
  - "Проверьте звук в другом приложении — например, в браузере"
escalate_if: "звука нет ни в одном приложении и ни на одном устройстве вывода"