id: KB-HW-003
category: оборудование
title: Нет звука на компьютере
symptoms:
  - "нет звука"
  - "звук пропал"
  - "не работают колонки"
  - "наушники не слышно"
  - "звука нет на ноутбуке"
required_slots:
  - key: output
    question: "Куда должен идти звук?"
    options: ["Колонки", "Наушники", "Встроенные динамики"]
steps:
  - "Нажмите значок динамика в правой части панели задач и уберите отключение звука, если рядом с ползунком громкости отображается значок перечёркнутого динамика."
  - "Проверьте кабель и питание колонок или наушников, чтобы после подключения и включения устройство могло воспроизводить звук."
  - "Нажмите значок динамика в правой части панели задач и выберите нужные колонки или наушники в списке устройств вывода, после чего звук должен пойти через них."
  - "Перезагрузите компьютер через меню «Пуск», чтобы звуковая служба и подключённое устройство запустились заново."
  - "Включите видео или музыку в другом приложении, например в браузере, и если там звук появился, проблема связана с первым приложением."
escalate_if: "Обратитесь в техподдержку, если звука нет во всех приложениях после проверки устройства вывода и перезагрузки."
