id: KB-HW-011
category: оборудование
title: Закончился тонер или картридж
symptoms:
  - "нужен новый картридж"
  - "печатает бледно, кончается тонер"
  - "принтер просит заменить картридж"
steps:
  - "Откройте состояние принтера в настройках устройств или на его экране — там будет указано, заканчивается ли тонер или требуется замена картриджа."
  - "Откройте крышку принтера и проверьте, что картридж установлен ровно и до конца, не касаясь его рабочей поверхности — после закрытия принтер должен перестать сообщать об ошибке установки."
  - "Закройте крышку принтера и напечатайте тестовую страницу из его свойств — отпечаток покажет, исчезла ли бледность текста."
  - "Выберите замену картриджа в меню состояния принтера, если устройство подтверждает его окончательное окончание, — на экране появится порядок замены или сообщение о необходимости установить новый картридж."
escalate_if: "Обратитесь в техподдержку, если картридж закончился, принтер не распознаёт установленный картридж или печать остаётся бледной."
