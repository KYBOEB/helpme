id: KB-HW-014
category: оборудование
title: Ноутбук не заряжается
symptoms:
  - "не идёт зарядка"
  - "подключил блок, а процент не растёт"
  - "ноутбук работает только от сети"
steps:
  - "Проверьте, что штекер блока питания полностью вставлен в ноутбук и адаптер, а на адаптере или ноутбуке должен загореться индикатор питания."
  - "Подключите блок питания к другой исправной розетке, после чего значок батареи в панели задач должен показать подключение к сети."
  - "Откройте меню «Параметры», выберите «Система» и «Питание и батарея», чтобы проверить, отображается ли состояние «Подключено» или «Заряжается»."
  - "Перезагрузите ноутбук с подключённым блоком питания, после чего процент заряда должен начать расти или система должна показать причину ограничения зарядки."
escalate_if: "Если индикатор не загорается, заряд не начинается с исправной розеткой или ноутбук работает только от сети, обратитесь в техподдержку."
