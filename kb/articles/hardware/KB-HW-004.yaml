id: KB-HW-004
category: оборудование
title: Не виден второй монитор
symptoms:
  - "не видит второй монитор"
  - "второй экран не работает"
  - "не подключается второй монитор"
  - "второй дисплей не определяется"
  - "нет изображения на втором экране"
required_slots:
  - key: connection
    question: "Как подключён второй монитор?"
    options: ["HDMI", "DisplayPort", "VGA / DVI", "Через док-станцию"]
steps:
  - "Проверьте кабель второго монитора с обеих сторон, чтобы он плотно входил и в разъём монитора, и в разъём компьютера."
  - "Нажмите кнопку питания на втором мониторе и выберите на нём источник сигнала, соответствующий подключённому кабелю, после чего должен появиться экран компьютера."
  - "Нажмите клавиши Win+P и выберите «Расширить», чтобы Windows использовала второй монитор как отдельный экран."
  - "Подключите монитор другим кабелем или вставьте его кабель в другой разъём компьютера, чтобы проверить, появляется ли изображение."
  - "Перезагрузите компьютер с подключённым монитором, чтобы система заново обнаружила второй экран при запуске."
escalate_if: "Обратитесь в техподдержку, если второй монитор не определяется или не показывает изображение после этих проверок."
