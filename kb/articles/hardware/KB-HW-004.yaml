id: KB-HW-004
category: оборудование
title: Не виден второй монитор
symptoms:
  - "не видит второй монитор"
  - "второй экран не работает"
  - "не подключается второй монитор"
  - "второй дисплей не определяется"
  - "нет изображения на втором экране"
required_slots:
  - key: connection
    question: "Как подключён второй монитор?"
    options: ["HDMI", "DisplayPort", "VGA / DVI", "Через док-станцию"]
steps:
  - "Проверьте, что кабель плотно вставлен и в монитор, и в компьютер"
  - "Проверьте, что монитор включён и выбран правильный источник сигнала"
  - "Нажмите Win+P и выберите режим «Расширить»"
  - "Попробуйте другой кабель или другой порт на компьютере"
  - "Перезагрузите компьютер с подключённым монитором"
escalate_if: "второй монитор не определяется ни на одном порту"