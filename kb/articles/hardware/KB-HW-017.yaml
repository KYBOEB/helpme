id: KB-HW-017
category: оборудование
title: Проектор не показывает изображение
symptoms:
  - "проектор не видит ноутбук"
  - "на экране нет сигнала"
  - "не выводится презентация на проектор"
steps:
  - "Включите проектор кнопкой питания на его корпусе или пульте, после чего на экране появится заставка или сообщение об отсутствии сигнала."
  - "Выберите на проекторе кнопку или пункт «Источник» и укажите вход HDMI или VGA, к которому подключён ноутбук, после чего проектор начнёт искать изображение на этом входе."
  - "Проверьте кабель между ноутбуком и проектором в разъёмах обоих устройств, после чего сообщение «Нет сигнала» должно исчезнуть при исправном кабеле."
  - "Нажмите сочетание клавиш «Win+P» на ноутбуке и выберите «Дублировать» в появившемся меню, после чего изображение рабочего стола должно появиться на проекторе."
  - "Перезапустите проектор кнопкой питания на его корпусе или пульте, после чего снова проверьте выбранный источник сигнала."
escalate_if: "Обратитесь в техподдержку, если проектор не показывает изображение с исправно подключённого ноутбука."
