id: KB-HW-012
category: оборудование
title: Не работает сканер
symptoms:
  - "не сканирует документы"
  - "сканер не отвечает"
  - "не приходит скан на почту"
required_slots:
  - key: connection
    question: "Как подключено устройство?"
    options: ["По сети", "По USB", "По Wi-Fi"]
steps:
  - "Проверьте, включён ли сканер и плотно ли подключён кабель питания, а на панели сканера должна гореть индикаторная лампа."
  - "Проверьте кабель USB или сетевое подключение сканера, после чего в используемой программе сканер должен появиться в списке доступных устройств."
  - "Откройте программу для сканирования, выберите подключённый сканер и запустите пробное сканирование, чтобы документ появился в окне предварительного просмотра."
  - "Проверьте папку «Спам» и правильность адреса получателя, если скан должен прийти по электронной почте, и при успешной отправке письмо должно появиться среди входящих сообщений."
escalate_if: "Если сканер не включается, не определяется компьютером или скан не отправляется после этих проверок, обратитесь в техподдержку."
