id: KB-HW-018
category: оборудование
title: Нужна замена или новое оборудование
symptoms:
  - "нужен новый монитор"
  - "сломалась мышь, нужна замена"
  - "как получить оборудование"
steps:
  - "Проверьте состояние оборудования и его кабеля или батареек на рабочем месте, после чего станет понятно, связана ли проблема с самим устройством или подключением."
  - "Подключите оборудование к другому доступному разъёму компьютера, после чего устройство должно определиться или заработать при исправном разъёме."
  - "Запишите название устройства, его инвентарный или серийный номер при наличии и кратко опишите неисправность, чтобы специалист смог подобрать замену."
  - "Обратитесь в техподдержку с этой информацией и укажите, какое оборудование вам нужно, после чего специалист сообщит доступный способ замены или выдачи."
escalate_if: "Обратитесь в техподдержку, если оборудование неисправно или вам требуется новое устройство для работы или учёбы."
