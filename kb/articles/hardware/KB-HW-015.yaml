id: KB-HW-015
category: оборудование
title: Не работает USB-порт
symptoms:
  - "не видит флешку"
  - "порт usb не реагирует"
  - "устройство в разъёме не определяется"
steps:
  - "Выньте устройство из USB-порта и подключите его снова, после чего в «Проводнике» или в окне подключённой программы оно должно появиться среди доступных устройств."
  - "Подключите устройство к другому USB-порту на этом же ноутбуке, чтобы проверить, определяется ли оно в другом разъёме."
  - "Проверьте этот USB-порт с другим исправным устройством, и если второе устройство тоже не определяется, проблема, вероятно, связана с портом."
  - "Перезагрузите ноутбук через меню «Пуск» и снова подключите устройство, после чего система должна показать уведомление о его обнаружении."
escalate_if: "Если несколько исправных устройств не определяются в одном порту или ни один USB-порт не работает, обратитесь в техподдержку."
