id: KB-HW-009
category: оборудование
title: Принтер печатает пустые страницы
symptoms:
  - "выходит чистый лист"
  - "печатает пустое"
  - "бумага выходит без текста"
required_slots:
  - key: connection
    question: "Как подключено устройство?"
    options: ["По сети", "По USB", "По Wi-Fi"]
steps:
  - "Откройте настройки принтеров в операционной системе и проверьте состояние нужного принтера — рядом с ним должно быть указано, что он подключён и готов к печати."
  - "Откройте документ и в окне печати выберите именно этот принтер — в предварительном просмотре должны отображаться текст или изображения, которые выйдут на бумаге."
  - "Откройте свойства выбранного принтера и запустите печать тестовой страницы — по результату будет понятно, печатает ли сам принтер, а не только приложение."
  - "Проверьте уровень тонера или чернил в свойствах принтера либо на его экране — при сообщении о низком уровне картридж потребуется заменить."
  - "Откройте документ в другом приложении и напечатайте одну страницу — если она тоже выйдет пустой, причина, скорее всего, связана с принтером или картриджем."
escalate_if: "Обратитесь в техподдержку, если тестовая страница остаётся пустой при подключённом и готовом принтере."
