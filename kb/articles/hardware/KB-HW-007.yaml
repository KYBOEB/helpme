id: KB-HW-007
category: оборудование
title: Не работает веб-камера
symptoms:
  - "камера не включается"
  - "в видеозвонке чёрный квадрат"
  - "не видят меня на созвоне"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Проверьте шторку или переключатель на корпусе веб-камеры и откройте её, после чего изображение камеры должно появиться в приложении для видеозвонка."
  - "Откройте системные настройки конфиденциальности камеры и разрешите доступ к камере для устройства и нужного приложения, после чего приложение должно получить возможность показывать изображение."
  - "Откройте настройки видео в приложении для видеозвонка и выберите встроенную или подключённую веб-камеру, чтобы в окне предварительного просмотра появилось ваше изображение."
  - "Закройте приложение для видеозвонка и запустите его снова, чтобы проверить камеру после повторного подключения."
  - "Перезагрузите компьютер через меню питания операционной системы и снова откройте видеозвонок, чтобы исключить временный сбой устройства или приложения."
escalate_if: "Обратитесь в техподдержку, если камера не определяется системой или остаётся чёрный экран после проверки разрешений и выбора устройства."
