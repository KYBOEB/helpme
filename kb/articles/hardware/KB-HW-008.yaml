id: KB-HW-008
category: оборудование
title: Не работает микрофон на созвоне
symptoms:
  - "меня не слышно"
  - "микрофон не ловит звук"
  - "в конференции нет моего голоса"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте окно созвона и нажмите значок микрофона — если он перечёркнут или рядом указано «Выключен», микрофон включится, и участники смогут вас слышать."
  - "Откройте список устройств звука в окне созвона и выберите нужный микрофон — индикатор уровня звука должен реагировать на вашу речь."
  - "Откройте настройки звука операционной системы и проверьте разрешение на доступ к микрофону для приложения созвона — после включения разрешения приложение сможет получать звук."
  - "Подключите микрофон или гарнитуру к другому доступному разъёму и снова войдите в созвон — если устройство определится, в настройках появится его название."
escalate_if: "Обратитесь в техподдержку, если микрофон не определяется или не передаёт звук после проверки разрешений и подключения."
