id: KB-ACCESS-018
category: доступы
title: Нет доступа к корпоративной справочной системе
symptoms:
  - "не пускает в справочную систему"
  - "нет доступа к корпоративной базе знаний компании"
  - "справочная система пишет что доступа нет"
  - "не открывается корпоративная справочно-правовая система"
  - "коллега заходит, а я нет"
required_slots:
  - key: system
    question: "В какую именно систему не пускает?"
    optional: true
steps:
  - "Откройте страницу входа в систему и войдите под своей рабочей учётной записью, а не под личной почтой — доступ выдаётся именно на рабочий адрес, и под личным его не будет"
  - "Если система открылась, но разделы закрыты, посмотрите в правом верхнем углу, под какой учётной записью вы вошли — при совпадении нескольких профилей браузер часто подставляет не тот"
  - "Выйдите из системы полностью и войдите заново: доступ мог быть выдан уже после того, как вы вошли, и старая сессия о нём не знает"
  - "Откройте систему в другом браузере или в окне без расширений — так вы поймёте, дело в правах или в браузере"
  - "Если ни один из способов не помог, уточните у руководителя, оформлен ли на вас доступ: часть систем выдаётся не всем сотрудникам, а по заявке"
escalate_if: "вход выполняется, но разделы остаются закрытыми, либо заявка на доступ не оформлена"
