id: KB-ACCESS-013
category: доступы
title: Не приходит письмо для сброса пароля
symptoms:
  - "запросил сброс пароля, письма нет"
  - "не приходит ссылка на восстановление"
  - "письмо для смены пароля не дошло"
steps:
  - "Откройте папки «Спам», «Нежелательная почта» и «Промоакции» в почтовом ящике — письмо для сброса пароля может находиться не во входящих."
  - "Вернитесь на страницу восстановления пароля и проверьте указанный адрес электронной почты — после отправки запроса появится сообщение о результате операции."
  - "Выполните поиск по почтовому ящику по словам «пароль» или «восстановление» — найденное письмо будет содержать ссылку для смены пароля, если оно дошло."
  - "Повторите запрос на восстановление пароля один раз через несколько минут — в почтовом ящике появится новое письмо, если сервис отправляет сообщения без задержки."
  - "Откройте ссылку из самого последнего письма — страница смены пароля покажет поле для ввода нового пароля, если ссылка ещё действительна."
escalate_if: "Обратитесь в техподдержку, если письмо отсутствует во всех папках после повторного запроса или указанного адреса больше нет."
