id: KB-ACCESS-007
category: доступы
title: Истёк срок действия пароля
symptoms:
  - "пишет что пароль устарел"
  - "требует сменить пароль"
  - "срок действия пароля закончился"
steps:
  - "Откройте страницу входа в корпоративную учётную запись и введите текущие данные, после чего система должна предложить сменить просроченный пароль."
  - "Выберите на странице входа пункт «Сменить пароль» или «Забыли пароль?», задайте новый пароль по требованиям системы и дождитесь сообщения об успешной смене."
  - "Выйдите из уже открытых приложений университета и войдите в них с новым паролем, после чего приложения должны принять обновлённые данные."
escalate_if: "Обратитесь в техподдержку, если система не предлагает смену пароля, не принимает новый пароль или у вас нет доступа к способу восстановления."
