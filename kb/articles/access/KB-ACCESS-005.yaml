id: KB-ACCESS-005
category: доступы
title: Не приходит код подтверждения при входе
symptoms:
  - "не приходит смс с кодом"
  - "нет кода подтверждения"
  - "не приходит пуш для входа"
  - "двухфакторка не срабатывает"
  - "не могу подтвердить вход"
required_slots:
  - key: method
    question: "Каким способом должно приходить подтверждение?"
    options: ["СМС", "Push в приложении", "Код из приложения-аутентификатора", "Письмо на почту"]
steps:
  - "Проверьте значок сети в верхней части экрана телефона и убедитесь, что отображаются полоски сигнала или значок мобильной сети, чтобы телефон мог получить код."
  - "На странице входа подождите 60 секунд и нажмите «Отправить код повторно», после чего должен прийти новый код."
  - "Откройте почтовое приложение и проверьте папки «Спам» и «Нежелательная почта», если код должен прийти письмом."
  - "Откройте настройки приложения-аутентификатора и включите автоматическую установку даты и времени, чтобы одноразовый код формировался по правильному времени."
  - "Откройте страницу входа на другом телефоне или компьютере и попробуйте подтвердить вход там, чтобы проверить, связан ли сбой с первым устройством."
escalate_if: "Обратитесь в техподдержку, если код не приходит ни по одному доступному способу или вход не подтверждается на другом устройстве."
