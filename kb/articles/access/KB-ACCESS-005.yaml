id: KB-ACCESS-005
category: доступы
title: Не приходит код подтверждения при входе
symptoms:
  - "не приходит смс с кодом"
  - "нет кода подтверждения"
  - "не приходит пуш для входа"
  - "двухфакторка не срабатывает"
  - "не могу подтвердить вход"
required_slots:
  - key: method
    question: "Каким способом должно приходить подтверждение?"
    options: ["СМС", "Push в приложении", "Код из приложения-аутентификатора", "Письмо на почту"]
steps:
  - "Проверьте, что телефон в сети и ловит сигнал"
  - "Подождите 60 секунд и запросите код повторно"
  - "Проверьте папку «Спам» в почте, если код приходит письмом"
  - "Проверьте, что приложение-аутентификатор синхронизировано по времени"
  - "Попробуйте войти с другого устройства"
escalate_if: "код не приходит ни одним из способов"