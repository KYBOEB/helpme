id: KB-ACCESS-016
category: доступы
title: Не работает вход по электронной подписи
symptoms:
  - "не видит электронную подпись"
  - "токен не определяется"
  - "эцп не проходит проверку"
steps:
  - "Подключите носитель электронной подписи к компьютеру и откройте список устройств в настройках операционной системы — токен или считыватель должны появиться среди подключённых устройств."
  - "Закройте лишние окна браузера и снова откройте страницу входа или подписания — запрос на выбор сертификата должен появиться при повторной попытке."
  - "На странице подписания выберите сертификат, срок действия которого не истёк, и подтвердите операцию — система покажет сообщение о принятой электронной подписи или укажет причину проверки."
  - "Откройте в браузере сведения о выбранном сертификате — в них должны отображаться владелец, срок действия и действующая цепочка сертификатов."
  - "Если токен не появляется в операционной системе, подключите его к другому USB-порту и повторите проверку — устройство может определиться после смены порта."
escalate_if: "Обратитесь в техподдержку, если токен не определяется, сертификат просрочен или система сообщает об ошибке криптографического провайдера."
