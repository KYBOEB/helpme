id: KB-ACCESS-004
category: доступы
title: Нужен доступ к новой корпоративной системе
symptoms:
  - "нужен доступ к системе"
  - "нет доступа к программе"
  - "прошу выдать доступ"
  - "как получить доступ к новому сервису"
  - "не пускает в корпоративную систему"
steps:
  - "Уточните у руководителя в рабочем чате или лично, нужен ли вам доступ к системе по вашей роли, и получите подтверждение необходимости доступа."
  - "Откройте портал заявок и найдите нужную корпоративную систему в каталоге, после чего проверьте, что выбрали именно тот сервис."
  - "Откройте форму заявки на странице найденной системы, укажите название системы, нужную роль и причину доступа, и убедитесь, что все поля заполнены."
  - "Отправьте заявку на согласование руководителю в форме заявки, после чего её статус должен измениться на «На согласовании» или аналогичный."
  - "После одобрения откройте страницу входа в корпоративную систему и войдите под своей корпоративной учётной записью, чтобы проверить появившийся доступ."
escalate_if: "Обратитесь в техподдержку, если заявка одобрена, но доступ не появился или система по-прежнему не принимает корпоративную учётную запись."
