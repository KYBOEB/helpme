id: KB-ACCESS-004
category: доступы
title: Нужен доступ к новой корпоративной системе
symptoms:
  - "нужен доступ к системе"
  - "нет доступа к программе"
  - "прошу выдать доступ"
  - "как получить доступ к новому сервису"
  - "не пускает в корпоративную систему"
steps:
  - "Уточните у руководителя, нужен ли вам этот доступ по роли"
  - "Откройте портал заявок и найдите нужную систему в каталоге"
  - "Оформите заявку: укажите систему, роль и обоснование"
  - "Согласуйте заявку с руководителем"
  - "После одобрения войдите в систему под корпоративной учётной записью"
escalate_if: "нужной системы нет в каталоге заявок"