id: KB-ACCESS-017
category: доступы
title: Единый вход работает не во всех системах
symptoms:
  - "в одну систему заходит, в другую нет"
  - "почему везде разные пароли"
  - "единый вход срабатывает через раз"
steps:
  - "Откройте страницу входа в корпоративную учётную запись и войдите заново в обычном окне браузера — после успешной проверки система должна предложить доступ к подключённым сервисам."
  - "Откройте проблемную систему в новом окне того же браузера и используйте кнопку входа через корпоративную учётную запись — появится либо нужный сервис, либо точное сообщение об отказе."
  - "Проверьте в адресной строке, что вы открываете правильный адрес системы, и сравните его с адресом сервиса, где вход уже работает — разные адреса могут использовать разные способы авторизации."
  - "Откройте проблемную систему в приватном окне браузера и войдите заново — если вход сработает, причиной могут быть сохранённые данные сеанса или cookies."
  - "В настройках браузера очистите cookies и данные сайта только для проблемной системы, затем закройте и снова откройте браузер — потребуется новый вход, после которого система покажет актуальный результат авторизации."
escalate_if: "Обратитесь в техподдержку, если в одной системе вход стабильно работает, а в другой появляется отказ в правах или сообщение о недоступной учётной записи."
