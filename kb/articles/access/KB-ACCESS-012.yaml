id: KB-ACCESS-012
category: доступы
title: Нужно продлить доступ к системе
symptoms:
  - "доступ закончился"
  - "нужно продлить права в системе"
  - "истекает срок доступа"
steps:
  - "Откройте нужную систему и найдите раздел «Профиль», «Учётная запись» или «Доступ» — там будет указана дата окончания прав, если система её показывает."
  - "Проверьте, что вы входите под своей рабочей или учебной учётной записью — имя пользователя или адрес учётной записи будет отображаться в профиле."
  - "Сохраните название системы, дату окончания доступа и текст сообщения об ошибке — эти данные понадобятся для оформления продления."
  - "Сообщите руководителю или ответственному за работу с этой системой о необходимости продления — запрос на доступ будет направлен тому, кто может его подтвердить."
escalate_if: "Обратитесь в техподдержку, если срок доступа уже истёк, система не показывает его дату или после подтверждения продление не применилось."
