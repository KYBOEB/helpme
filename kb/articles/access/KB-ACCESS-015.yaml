id: KB-ACCESS-015
category: доступы
title: Нужен временный доступ коллеге на период отпуска
symptoms:
  - "ухожу в отпуск, нужно передать доступ"
  - "дайте коллеге права на время"
  - "как открыть доступ заместителю"
steps:
  - "Свяжитесь с коллегой и уточните, какие именно системы и действия понадобятся ему на время вашего отпуска — это поможет выдать только необходимый доступ."
  - "В нужной системе откройте раздел управления доступом или делегирования полномочий и выберите добавление пользователя — появится форма, где можно указать коллегу и его права."
  - "В форме предоставления доступа укажите коллегу, выберите только нужные разрешения и задайте дату окончания отпуска — система покажет срок действия перед сохранением."
  - "Перед сохранением проверьте имя коллеги, перечень разрешений и дату окончания, а затем нажмите «Сохранить» или «Предоставить доступ» — система подтвердит назначение временных прав."
  - "После возвращения откройте тот же раздел управления доступом и отключите делегирование раньше срока, если оно больше не нужно — доступ коллеги прекратится, а ваши права сохранятся."
escalate_if: "Обратитесь в техподдержку, если в системе нет делегирования, нельзя задать срок окончания или для предоставления доступа требуется согласование."
