id: KB-ACCESS-002
category: доступы
title: Учётная запись заблокирована
symptoms:
  - "учетка заблокирована"
  - "аккаунт заблокирован"
  - "не могу войти учетная запись заблокирована"
  - "слишком много попыток входа"
  - "логин заблокирован"
steps:
  - "Подождите 15 минут — часто блокировка снимается автоматически"
  - "Проверьте, что вводите правильный логин и пароль"
  - "Попробуйте войти с другого устройства"
  - "Если блокировка сохраняется — обратитесь в поддержку для разблокировки"
escalate_if: "учётная запись остаётся заблокированной после 15 минут"