id: KB-ACCESS-002
category: доступы
title: Учётная запись заблокирована
symptoms:
  - "учетка заблокирована"
  - "аккаунт заблокирован"
  - "не могу войти учетная запись заблокирована"
  - "слишком много попыток входа"
  - "логин заблокирован"
steps:
  - "Подождите 15 минут и не повторяйте попытки входа на странице корпоративной учётной записи — если блокировка временная, доступ обычно восстановится автоматически."
  - "Откройте страницу входа и внимательно проверьте логин и пароль в соответствующих полях — без опечаток система либо впустит вас, либо снова покажет сообщение о блокировке."
  - "Откройте страницу входа на другом устройстве и попробуйте войти с теми же данными — вы поймёте, связана ли проблема с текущим устройством."
  - "Сохраните сообщение о блокировке с экрана страницы входа — оно понадобится специалисту для проверки и разблокировки учётной записи."
escalate_if: "Если учётная запись остаётся заблокированной после ожидания или вход невозможен на другом устройстве, обратитесь в техподдержку."
