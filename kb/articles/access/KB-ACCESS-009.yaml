id: KB-ACCESS-009
category: доступы
title: Нужен доступ к общему диску отдела
symptoms:
  - "нужен доступ к папке отдела"
  - "не вижу сетевой диск коллег"
  - "дайте права на общую папку"
steps:
  - "Подключите компьютер к университетской сети или запустите утверждённую VPN-программу, после чего общий диск может появиться в проводнике автоматически."
  - "Откройте «Проводник» и выберите «Этот компьютер», после чего проверьте, отображается ли сетевой диск отдела среди доступных дисков."
  - "Попросите руководителя или владельца папки подтвердить, что вам нужен доступ к общему диску, после чего владелец сможет направить запрос на выдачу прав через привычный канал обращения в техподдержку."
escalate_if: "Обратитесь в техподдержку, если сетевой диск не появляется после подключения к сети или вы получили отказ в доступе к папке."
