id: KB-ACCESS-011
category: доступы
title: Не открывается личный кабинет
symptoms:
  - "личный кабинет не пускает"
  - "не заходит в кабинет сотрудника"
  - "портал не принимает логин"
steps:
  - "Откройте страницу входа в личный кабинет и внимательно введите логин вручную — под полем входа появится сообщение об ошибке, если система не принимает данные."
  - "Проверьте раскладку клавиатуры и отключите Caps Lock перед повторным вводом логина и пароля — введённые символы будут соответствовать вашим данным."
  - "Откройте страницу входа в приватном окне браузера — кабинет загрузится без сохранённых cookies и расширений, если проблема связана с данными обычного окна."
  - "Попробуйте войти через другой поддерживаемый браузер на том же компьютере — если вход сработает, проблема связана с настройками первого браузера."
  - "Запишите точный текст ошибки и время попытки входа — эти сведения будут видны техподдержке при проверке доступа."
escalate_if: "Обратитесь в техподдержку, если вход не выполняется в разных браузерах или появляется сообщение о блокировке учётной записи."
