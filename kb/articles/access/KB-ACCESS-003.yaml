id: KB-ACCESS-003
category: доступы
title: Нет доступа к сетевой папке
symptoms:
  - "нет доступа к папке"
  - "не открывается сетевая папка"
  - "папка на сервере недоступна"
  - "отказано в доступе к shared"
  - "не вижу корпоративную папку"
required_slots:
  - key: folder
    question: "К какой именно папке нужен доступ?"
    optional: true
steps:
  - "Проверьте, что вы в корпоративной сети или подключены к VPN"
  - "Откройте папку по её сетевому пути (\\\\server\\share)"
  - "Перезайдите в систему и попробуйте открыть папку снова"
  - "Уточните у коллеги из вашего отдела, есть ли у него доступ к этой папке"
  - "Если папка новая — оформите заявку на доступ через портал"
escalate_if: "доступ к папке нужен, но заявку не удаётся оформить"