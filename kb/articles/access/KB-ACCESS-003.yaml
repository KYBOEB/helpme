id: KB-ACCESS-003
category: доступы
title: Нет доступа к сетевой папке
symptoms:
  - "нет доступа к папке"
  - "не открывается сетевая папка"
  - "папка на сервере недоступна"
  - "отказано в доступе к shared"
  - "не вижу корпоративную папку"
required_slots:
  - key: folder
    question: "К какой именно папке нужен доступ?"
    optional: true
steps:
  - "Подключитесь к корпоративной сети или запустите VPN на компьютере — индикатор сети или VPN покажет активное подключение."
  - "Откройте «Проводник» и введите известный вам сетевой путь к папке в адресной строке в формате \\\\server\\share — папка откроется или появится сообщение с причиной отказа."
  - "Выйдите из учётной записи Windows через меню «Пуск» и войдите снова — после входа повторно откройте сетевую папку."
  - "Узнайте у коллеги из вашего отдела, открывается ли эта папка на его рабочем компьютере — если у коллеги доступ есть, проблема, скорее всего, связана с правами вашей учётной записи."
  - "Запишите название папки и её сетевой путь — эти сведения понадобятся техподдержке для проверки доступа."
escalate_if: "Если папка не открывается после подключения к сети и повторного входа, обратитесь в техподдержку для проверки прав."
