id: KB-ACCESS-019
category: доступы
title: Истёк доступ к системе онлайн-обучения
symptoms:
  - "закончился доступ к курсам"
  - "не пускает на обучение"
  - "подписка на обучение истекла"
  - "не могу продолжить курс"
  - "пропал доступ к вебинарам"
steps:
  - "Откройте страницу входа и посмотрите сообщение целиком: система обычно пишет, истёк ли срок доступа или он не был оформлен вовсе — это разные случаи"
  - "Проверьте в личном кабинете раздел с вашими подписками или курсами: там видно дату окончания доступа и то, на какую учётную запись он оформлен"
  - "Если срок ещё не вышел, выйдите и войдите заново — сведения о продлении подтягиваются при новом входе"
  - "Уточните у руководителя, продлевается ли доступ на новый период: в большинстве компаний это решение подразделения, а не технический сбой"
  - "Пройденные материалы и сертификаты сохраняются за вашей учётной записью, поэтому при продлении обучение продолжится с того же места"
escalate_if: "срок доступа не истёк, но система всё равно не пускает"
