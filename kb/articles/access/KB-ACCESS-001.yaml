id: KB-ACCESS-001
category: доступы
title: Забыл пароль от учётной записи
symptoms:
  - "забыл пароль"
  - "не помню пароль от учетки"
  - "не могу войти в учетную запись"
  - "восстановить пароль"
  - "пароль не подходит"
steps:
  - "Откройте страницу сброса пароля корпоративной учётной записи и выберите пункт «Восстановление пароля» — появится форма для ввода логина."
  - "Введите логин в форме восстановления и подтвердите личность кодом из СМС или письма — система разрешит создать новый пароль."
  - "Введите новый пароль длиной не менее 12 символов с буквами, цифрами и специальными символами в поле нового пароля — система покажет, что пароль соответствует требованиям."
  - "Вернитесь на страницу входа в корпоративную учётную запись и войдите с новым паролем — после входа откройте почту и убедитесь, что она доступна."
escalate_if: "Если код подтверждения не приходит или новый пароль не принимается, обратитесь в техподдержку."
