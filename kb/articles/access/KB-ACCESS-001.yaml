id: KB-ACCESS-001
category: доступы
title: Забыл пароль от учётной записи
symptoms:
  - "забыл пароль"
  - "не помню пароль от учетки"
  - "не могу войти в учетную запись"
  - "восстановить пароль"
  - "пароль не подходит"
steps:
  - "Откройте страницу сброса пароля корпоративной учётной записи"
  - "Введите логин и подтвердите личность по коду из СМС или письма"
  - "Придумайте новый пароль: не короче 12 символов, буквы, цифры, спецсимвол"
  - "Войдите с новым паролем и проверьте доступ к почте"
escalate_if: "сброс пароля недоступен или учётная запись не найдена"