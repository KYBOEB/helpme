id: KB-ACCESS-008
category: доступы
title: Нужен доступ для нового сотрудника
symptoms:
  - "вышел новый человек, нужны доступы"
  - "оформите доступы новому сотруднику"
  - "что нужно для начала работы новичку"
steps:
  - "Составьте список сервисов и общих ресурсов, которые нужны новому сотруднику для работы, после чего у руководителя будет полный перечень для оформления доступа."
  - "Попросите руководителя направить запрос через привычный канал обращения в техподдержку и указать полное имя сотрудника, дату начала работы и нужные ресурсы, после чего специалист сможет проверить основания для выдачи доступа."
  - "После подтверждения оформления откройте страницу входа в корпоративную учётную запись и попробуйте войти с данными нового сотрудника, после чего станет понятно, создана ли учётная запись."
escalate_if: "Обратитесь в техподдержку, если учётная запись не создана к началу работы или сотруднику не выдали доступ к нужным сервисам."
