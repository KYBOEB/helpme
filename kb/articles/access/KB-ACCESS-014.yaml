id: KB-ACCESS-014
category: доступы
title: Двухфакторная аутентификация на новом телефоне
symptoms:
  - "сменил телефон и не могу подтвердить вход"
  - "новый телефон не генерирует коды"
  - "как перенести двухфакторку"
required_slots:
  - key: device
    question: "О каком устройстве речь?"
    options: ["Рабочий компьютер", "Ноутбук", "Телефон", "Планшет"]
steps:
  - "Если старый телефон у вас есть, подтвердите вход с его помощью на странице входа в корпоративную учётную запись, чтобы открыть настройки безопасности."
  - "Откройте настройки безопасности учётной записи и выберите раздел двухэтапной проверки или приложения-аутентификатора, после чего появится возможность добавить новый телефон."
  - "На новом телефоне откройте приложение-аутентификатор и отсканируйте QR-код со страницы настройки, после чего приложение начнёт показывать коды для этой учётной записи."
  - "Введите код с нового телефона в поле подтверждения на странице настройки двухэтапной проверки, после чего новый способ подтверждения будет добавлен."
  - "Оставьте старый телефон подключённым к учётной записи до проверки нового способа, чтобы при ошибке можно было снова подтвердить вход старым телефоном."
  - "Если старого телефона нет, выберите на странице входа пункт «Другой способ» или «Не могу подтвердить вход», после чего появятся доступные варианты восстановления доступа."
escalate_if: "Обратитесь в техподдержку, если старого телефона нет и ни один способ восстановления на странице входа недоступен."
