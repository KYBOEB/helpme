id: KB-ACCESS-006
category: доступы
title: Пароль не подходит при входе в систему
symptoms:
  - "пароль не подходит"
  - "неверный пароль"
  - "не принимает пароль"
  - "пишет неверный логин или пароль"
  - "пароль правильный но не пускает"
required_slots:
  - key: where
    question: "Куда не пускает?"
    options: ["Вход в Windows", "Корпоративная почта", "VPN", "Корпоративный портал"]
steps:
  - "Посмотрите на панель языка в правом нижнем углу экрана входа и выключите Caps Lock, чтобы пароль вводился в нужной раскладке и с правильным регистром."
  - "Введите пароль вручную в поле «Пароль» на странице входа, не вставляя его из буфера обмена, чтобы исключить лишние пробелы или скрытые символы."
  - "Проверьте поле «Логин» на странице входа и введите имя в формате «домен\\логин», после чего система должна распознать учётную запись."
  - "Откройте страницу восстановления учётной записи по ссылке «Забыли пароль?» на странице входа и задайте новый пароль, если старый по-прежнему не принимается."
  - "Вернитесь на страницу входа и введите новый пароль вручную, чтобы проверить доступ к системе."
escalate_if: "Обратитесь в техподдержку, если новый пароль также не подходит или страница восстановления учётной записи недоступна."
