id: KB-ACCESS-006
category: доступы
title: Пароль не подходит при входе в систему
symptoms:
  - "пароль не подходит"
  - "неверный пароль"
  - "не принимает пароль"
  - "пишет неверный логин или пароль"
  - "пароль правильный но не пускает"
required_slots:
  - key: where
    question: "Куда не пускает?"
    options: ["Вход в Windows", "Корпоративная почта", "VPN", "Корпоративный портал"]
steps:
  - "Проверьте раскладку клавиатуры и выключенный Caps Lock"
  - "Попробуйте ввести пароль вручную, не копируя его"
  - "Проверьте, что логин вводите в правильном формате (домен\\логин)"
  - "Сбросьте пароль через страницу восстановления учётной записи"
  - "Войдите с новым паролем"
escalate_if: "новый пароль тоже не принимается"