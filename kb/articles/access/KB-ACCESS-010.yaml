id: KB-ACCESS-010
category: доступы
title: Нет прав на установку программ
symptoms:
  - "не даёт установить программу"
  - "нужны права администратора"
  - "установка требует пароль администратора"
steps:
  - "Откройте установочный файл программы из папки «Загрузки» и запустите его обычным двойным щелчком — появится окно установки или запрос имени и пароля администратора."
  - "Если появится запрос администратора, введите только предоставленные вам рабочие учётные данные — установка продолжится, если у вашей учётной записи есть нужные права."
  - "Перезагрузите компьютер через меню «Пуск» или меню Apple и повторно откройте установочный файл — временный сбой исчезнет, если он мешал установке."
  - "Если программа нужна для учебной или рабочей задачи, сохраните название программы и текст сообщения из окна запроса — эти сведения помогут техподдержке понять, какие права требуются."
escalate_if: "Обратитесь в техподдержку, если система требует пароль администратора, которого у вас нет, или установка завершается сообщением об отказе в доступе."
