id: KB-VPN-015
category: VPN
title: Не приходит второй фактор при входе в VPN
symptoms:
  - "не приходит код для впн"
  - "vpn ждёт подтверждение а его нет"
  - "второй фактор не срабатывает"
required_slots:
  - key: device
    question: "О каком устройстве речь?"
    options: ["Рабочий компьютер", "Ноутбук", "Телефон", "Планшет"]
steps:
  - "На устройстве, где вы входите в VPN, проверьте подключение к интернету, открыв любой обычный сайт в браузере, и убедитесь, что страница загружается."
  - "На экране входа в VPN нажмите «Отправить код ещё раз» или «Повторить», если такая кнопка есть, и дождитесь нового запроса подтверждения."
  - "На устройстве, которое используется для второго фактора, откройте приложение для подтверждения входа или сообщения и проверьте уведомления, потому что запрос иногда появляется внутри приложения без отдельного оповещения."
  - "В настройках даты и времени устройства включите автоматическую установку времени, чтобы коды из приложения не отклонялись из-за неверных часов."
  - "Введите именно последний полученный код на странице входа в VPN, поскольку после повторной отправки предыдущие коды могут перестать действовать."
escalate_if: "Обратитесь в техподдержку, если уведомления и коды не появляются после этих действий или у вас больше нет доступа к устройству для подтверждения."
