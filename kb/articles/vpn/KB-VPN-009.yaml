id: KB-VPN-009
category: VPN
title: VPN просит логин и пароль повторно
symptoms:
  - "впн постоянно спрашивает пароль"
  - "vpn не запоминает вход"
  - "каждый раз ввожу пароль заново"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте приложение VPN в списке программ и проверьте, появляется ли окно для ввода логина и пароля."
  - "В окне входа VPN включите флажок «Запомнить меня» или «Сохранить данные», если такой пункт доступен, и после этого приложение сохранит выбранный способ входа."
  - "Введите рабочие логин и пароль в окне входа VPN и нажмите «Войти», после чего приложение должно подключиться без дополнительного запроса."
  - "Откройте настройки приложения VPN и проверьте разделы «Учётная запись», «Профиль» или «Безопасность», где может быть указано, запрещено ли сохранение пароля."
escalate_if: "Обратитесь в техподдержку, если VPN запрашивает пароль при каждом подключении, даже когда сохранение данных доступно и включено."
