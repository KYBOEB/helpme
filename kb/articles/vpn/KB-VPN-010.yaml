id: KB-VPN-010
category: VPN
title: VPN перестал работать после смены пароля
symptoms:
  - "сменил пароль и впн отвалился"
  - "после смены пароля не пускает в vpn"
  - "vpn ругается на пароль хотя он новый"
steps:
  - "Откройте приложение VPN в списке программ и отключите текущее соединение кнопкой «Отключиться», после чего состояние изменится на «Не подключено»."
  - "В окне VPN откройте форму входа и введите новый рабочий пароль, после чего приложение примет обновлённые данные или покажет сообщение об ошибке."
  - "В окне VPN нажмите «Подключиться», и при правильном новом пароле состояние изменится на «Подключено»."
  - "Перезапустите приложение VPN через его меню «Выход» и снова откройте его, после чего сохранённые данные обновятся при следующем входе."
escalate_if: "Обратитесь в техподдержку, если новый пароль работает в других сервисах, но VPN продолжает отклонять его или требует старый пароль."
