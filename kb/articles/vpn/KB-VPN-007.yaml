id: KB-VPN-007
category: VPN
title: Нужен доступ к VPN в первый раз
symptoms:
  - "как подключиться к впн"
  - "первый раз настраиваю vpn"
  - "дайте доступ к корпоративной сети"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте приложение VPN в списке программ на компьютере, после чего появится окно подключения."
  - "В окне VPN нажмите «Войти» или «Подключить», и откроется страница входа в корпоративную учётную запись."
  - "На странице входа в корпоративную учётную запись введите рабочие логин и пароль, после чего вы вернётесь в приложение VPN."
  - "В окне VPN нажмите «Подключиться», и статус изменится на «Подключено» или появится другой признак активного соединения."
escalate_if: "Обратитесь в техподдержку, если приложение VPN не установлено, учётные данные не принимаются или доступ к VPN ещё не предоставлен."
