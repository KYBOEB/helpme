id: KB-VPN-002
category: VPN
title: VPN постоянно обрывается
symptoms:
  - "впн отваливается"
  - "vpn断开"  # оставил как есть — при вычитке заменить на русскую формулировку
  - "vpn рвётся каждые пару минут"
  - "впн переподключается постоянно"
  - "соединение vpn нестабильно"
required_slots:
  - key: network
    question: "Где возникает обрыв?"
    options: ["Дома", "В офисе", "В командировке / мобильный интернет"]
steps:
  - "Проверьте стабильность обычного интернета без VPN"
  - "Переключитесь с Wi-Fi на кабель или мобильную сеть — проверьте, повторяется ли обрыв"
  - "В настройках VPN включите режим «Автопереподключение»"
  - "Обновите приложение VPN до последней версии"
  - "Перезапустите приложение VPN и подключитесь заново"
escalate_if: "обрывы продолжаются на стабильном интернете"