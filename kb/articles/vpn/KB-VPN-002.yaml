id: KB-VPN-002
category: VPN
title: VPN постоянно обрывается
symptoms:
  - "впн отваливается"
  - "vpn断开"
  - "vpn рвётся каждые пару минут"
  - "впн переподключается постоянно"
  - "соединение vpn нестабильно"
required_slots:
  - key: network
    question: "Где возникает обрыв?"
    options: ["Дома", "В офисе", "В командировке / мобильный интернет"]
steps:
  - "Отключите VPN и откройте несколько сайтов в браузере — если страницы загружаются без задержек и обрывов, проблема может быть связана именно с VPN-соединением."
  - "Подключите компьютер к интернету через кабель или мобильную сеть вместо текущей сети в системных настройках — если обрывы исчезнут, причиной, вероятно, является нестабильная Wi-Fi-сеть."
  - "Откройте приложение VPN, зайдите в его «Настройки» и включите переключатель «Автопереподключение» — при временном обрыве приложение начнёт подключаться повторно самостоятельно."
  - "Откройте магазин приложений или раздел обновления самого приложения VPN — если доступна новая версия, появится кнопка «Обновить»."
  - "Перезапустите приложение VPN и снова выберите нужный профиль в его главном окне — после подключения статус должен оставаться активным дольше нескольких минут."
escalate_if: "Обратитесь в техподдержку, если VPN обрывается в разных сетях после обновления и включения автопереподключения."
