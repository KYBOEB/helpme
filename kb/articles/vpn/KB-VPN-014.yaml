id: KB-VPN-014
category: VPN
title: VPN отключается после спящего режима
symptoms:
  - "открыл ноутбук и впн отвалился"
  - "после сна vpn не восстанавливается"
  - "каждый раз после спящего режима переподключаю vpn"
steps:
  - "Откройте окно программы VPN после выхода компьютера из спящего режима и нажмите «Подключиться» — статус должен измениться на активный."
  - "Проверьте подключение к Wi‑Fi или кабельной сети в настройках сети операционной системы и дождитесь, когда появится доступ к интернету."
  - "В окне программы VPN нажмите «Отключиться», подождите несколько секунд и снова нажмите «Подключиться» — соединение должно восстановиться."
  - "Перезагрузите компьютер через меню завершения работы операционной системы и после входа проверьте, подключается ли VPN без перехода в спящий режим."
escalate_if: "Обратитесь в техподдержку, если VPN отключается после каждого выхода из спящего режима даже при стабильном интернет-соединении."
