id: KB-VPN-012
category: VPN
title: Не запускается программа VPN
symptoms:
  - "клиент впн не открывается"
  - "vpn не стартует"
  - "приложение vpn закрывается сразу"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Найдите программу VPN в меню «Пуск» Windows или в папке «Программы» macOS и запустите её ещё раз — должно открыться окно входа или подключения."
  - "Закройте все окна программы VPN и снова откройте её через значок приложения — если программа сразу закрывается, проблема сохраняется."
  - "Перезагрузите компьютер через меню завершения работы операционной системы и после входа попробуйте открыть программу VPN повторно."
  - "Проверьте, не ожидает ли программа VPN подтверждения в отдельном окне на экране или в уведомлениях операционной системы, — после подтверждения должно появиться окно подключения."
escalate_if: "Обратитесь в техподдержку, если программа VPN не открывается или закрывается сразу после перезагрузки компьютера."
