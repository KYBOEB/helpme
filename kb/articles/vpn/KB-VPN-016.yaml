id: KB-VPN-016
category: VPN
title: "VPN не работает в чужой сети: кафе, отель, общежитие"
symptoms:
  - "в кафе впн не подключается"
  - "из отеля vpn не работает"
  - "в общежитии не пускает в рабочую сеть"
required_slots:
  - key: where
    question: "Откуда пытаетесь подключиться?"
    options: ["Из дома", "Из офиса", "Из другой сети"]
steps:
  - "Подключитесь к Wi-Fi в кафе, отеле или общежитии и откройте браузер — должна появиться страница входа в сеть, где нужно принять условия или ввести выданные данные."
  - "Завершите вход в общедоступную сеть и проверьте, что обычные сайты открываются — после этого VPN обычно получает доступ к интернету."
  - "Откройте приложение VPN и нажмите «Подключиться» — через несколько секунд оно должно показать активное защищённое соединение."
  - "Если VPN не подключился, переключитесь на мобильный интернет или другую сеть и повторите подключение — так вы поймёте, связана ли проблема именно с сетью в кафе, отеле или общежитии."
escalate_if: "Обратитесь в техподдержку, если VPN не подключается в разных сетях или появляется сообщение об ошибке."
