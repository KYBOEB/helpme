id: KB-VPN-003
category: VPN
title: Ошибка сертификата при подключении к VPN
symptoms:
  - "vpn ошибка сертификата"
  - "сертификат vpn истёк"
  - "недействительный сертификат впн"
  - "vpn certificate expired"
  - "впн не пускает из-за сертификата"
required_slots:
  - key: os
    question: "На каком устройстве ошибка?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте настройки VPN-профиля и посмотрите срок действия сертификата"
  - "Если срок истёк — обратитесь в поддержку для выпуска нового сертификата"
  - "Удалите старый профиль corp-vpn и добавьте его заново из выданного файла"
  - "Введите пароль от сертификата и подтвердите установку"
  - "Подключитесь к профилю corp-vpn"
escalate_if: "новый сертификат не устанавливается или ошибка сохраняется"