id: KB-VPN-003
category: VPN
title: Ошибка сертификата при подключении к VPN
symptoms:
  - "vpn ошибка сертификата"
  - "сертификат vpn истёк"
  - "недействительный сертификат впн"
  - "vpn certificate expired"
  - "впн не пускает из-за сертификата"
required_slots:
  - key: os
    question: "На каком устройстве ошибка?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте приложение VPN, зайдите в настройки профиля «corp-vpn» и найдите сведения о сертификате — на экране будет указана дата начала и окончания его действия."
  - "Если дата окончания уже прошла, обратитесь в техподдержку для выпуска нового сертификата — специалист сообщит, как получить новый файл и пароль к нему."
  - "В настройках VPN выберите добавление нового профиля и укажите выданный файл сертификата — новый профиль появится в списке доступных подключений."
  - "При установке нового сертификата введите выданный пароль в появившемся поле — приложение подтвердит успешную установку или сообщит об ошибке пароля."
  - "В списке профилей приложения VPN выберите новый профиль «corp-vpn» и нажмите «Подключиться» — статус профиля изменится на «Подключено» или появится сообщение о причине отказа."
escalate_if: "Обратитесь в техподдержку, если сертификат истёк, новый файл не выдан или приложение не принимает правильный пароль."
