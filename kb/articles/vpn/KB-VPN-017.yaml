id: KB-VPN-017
category: VPN
title: Два VPN конфликтуют между собой
symptoms:
  - "стоит два впн и оба не работают"
  - "личный vpn мешает рабочему"
  - "конфликт vpn клиентов"
steps:
  - "Откройте все приложения VPN на компьютере или телефоне и отключите активное соединение в каждом из них — в системе должно остаться подключение только к нужному VPN."
  - "В приложении личного VPN откройте «Настройки» и временно выключите «Автоподключение» или аналогичный параметр — личный VPN не будет запускаться одновременно с рабочим."
  - "Откройте системные настройки сети, найдите раздел «VPN» и отключите соединения, которые сейчас не нужны — в списке подключений останется только выбранный рабочий VPN."
  - "Перезапустите рабочее VPN-приложение и нажмите «Подключиться» — оно должно установить соединение без сообщения о конфликте."
escalate_if: "Обратитесь в техподдержку, если рабочий VPN не подключается после отключения всех остальных VPN."
