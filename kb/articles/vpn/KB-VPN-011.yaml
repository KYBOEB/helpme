id: KB-VPN-011
category: VPN
title: VPN подключён, но внутренние сайты не открываются
symptoms:
  - "впн подключился а порталы не грузятся"
  - "vpn работает но внутренние ресурсы недоступны"
  - "подключился, а рабочие сайты не открываются"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте окно программы VPN на компьютере и убедитесь, что соединение отмечено как активное, а не ожидающее подключения."
  - "В окне программы VPN нажмите «Отключиться», подождите несколько секунд и снова нажмите «Подключиться» — после повторного подключения статус должен измениться на активный."
  - "Откройте браузер, обновите страницу внутреннего сайта сочетанием клавиш Ctrl+R или Command+R и проверьте, появилась ли страница."
  - "Перезагрузите компьютер через меню завершения работы операционной системы и после входа снова подключите VPN."
escalate_if: "Обратитесь в техподдержку, если VPN подключён, но ни один внутренний сайт не открывается после повторного подключения и перезагрузки компьютера."
