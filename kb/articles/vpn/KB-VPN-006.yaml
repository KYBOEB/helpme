id: KB-VPN-006
category: VPN
title: После подключения к VPN пропадает интернет
symptoms:
  - "после включения vpn пропадает интернет"
  - "подключаю впн и сайты не открываются"
  - "впн блокирует интернет"
  - "с vpn нет доступа к внешним сайтам"
  - "интернет работает только без vpn"
steps:
  - "Откройте настройки телефона или компьютера, выключите VPN и загрузите любой сайт — если сайт открывается без VPN, обычное интернет-соединение работает."
  - "Запустите приложение VPN, подключитесь к VPN заново и откройте корпоративный портал — если портал открывается, VPN-соединение установлено."
  - "Откройте настройки активного VPN-подключения и проверьте режим маршрутизации — режим «Только корпоративная сеть» не должен быть включён, если вам нужен доступ к обычным сайтам."
  - "Закройте и снова откройте приложение VPN на устройстве — после запуска подключитесь к VPN ещё раз и проверьте загрузку сайта."
  - "Перезагрузите телефон или компьютер через системное меню питания — после включения повторите подключение к VPN."
escalate_if: "Обратитесь в техподдержку, если корпоративный портал открывается, но внешние сайты не работают после проверки режима маршрутизации и перезапуска устройства."
