id: KB-VPN-006
category: VPN
title: После подключения к VPN пропадает интернет
symptoms:
  - "после включения vpn пропадает интернет"
  - "подключаю впн и сайты не открываются"
  - "впн блокирует интернет"
  - "с vpn нет доступа к внешним сайтам"
  - "интернет работает только без vpn"
steps:
  - "Отключите VPN и проверьте, что обычный интернет работает"
  - "Подключитесь к VPN заново и откройте корпоративный портал"
  - "Проверьте, что в настройках VPN не включён режим «Только корпоративная сеть»"
  - "Перезапустите приложение VPN"
  - "Перезагрузите устройство"
escalate_if: "внешние сайты не открываются даже после переподключения VPN"