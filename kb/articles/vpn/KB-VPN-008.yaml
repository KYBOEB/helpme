id: KB-VPN-008
category: VPN
title: Не могу работать из дома без доступа к рабочим ресурсам
symptoms:
  - "не могу зайти в рабочую сеть из дома"
  - "из дома не открываются рабочие сайты"
  - "работаю удалённо, нет доступа к внутренним системам"
  - "вне офиса ничего не открывается"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Откройте любой сайт в браузере на домашнем компьютере, и если он не загружается, сначала станет понятно, что проблема связана с интернет-соединением."
  - "Откройте приложение VPN в списке программ и проверьте, что в нём отображается состояние «Отключено» или «Не подключено»."
  - "В окне VPN нажмите «Подключиться», и состояние изменится на «Подключено» или появится сообщение об успешном соединении."
  - "Откройте в браузере рабочий ресурс, к которому раньше был доступ из дома, и проверьте, загружается ли его страница."
  - "Перезапустите приложение VPN через его меню «Выход» и снова откройте его, после чего можно повторить подключение."
escalate_if: "Обратитесь в техподдержку, если интернет работает, но VPN не подключается или рабочие ресурсы остаются недоступны после успешного подключения."
