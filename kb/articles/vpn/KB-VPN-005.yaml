id: KB-VPN-005
category: VPN
title: Не могу подключиться к VPN с телефона
symptoms:
  - "на телефоне не работает vpn"
  - "не подключается впн на смартфоне"
  - "vpn на айфоне не коннектится"
  - "впн на андроиде не работает"
  - "мобильный vpn не подключается"
required_slots:
  - key: os
    question: "Какая операционная система на телефоне?"
    options: ["Android", "iOS"]
steps:
  - "Откройте браузер на телефоне без VPN и загрузите любой сайт через мобильный интернет — если страница не открывается, сначала восстановите обычное подключение к интернету."
  - "Откройте официальный магазин приложений телефона, найдите установленное приложение VPN и обновите его или установите заново — после этого появится актуальная версия приложения."
  - "Запустите приложение VPN и войдите под корпоративной учётной записью — после успешного входа откроется список доступных VPN-профилей."
  - "Откройте настройки телефона, найдите запрос на добавление VPN-профиля от приложения и разрешите его установку — в списке VPN появится профиль corp-vpn."
  - "Вернитесь в приложение VPN, выберите профиль corp-vpn и нажмите кнопку подключения — приложение покажет активное подключение или сообщение об ошибке."
escalate_if: "Обратитесь в техподдержку, если мобильный интернет работает, но профиль corp-vpn не устанавливается или подключение завершается ошибкой."
