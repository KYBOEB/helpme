id: KB-VPN-005
category: VPN
title: Не могу подключиться к VPN с телефона
symptoms:
  - "на телефоне не работает vpn"
  - "не подключается впн на смартфоне"
  - "vpn на айфоне не коннектится"
  - "впн на андроиде не работает"
  - "мобильный vpn не подключается"
required_slots:
  - key: os
    question: "Какая операционная система на телефоне?"
    options: ["Android", "iOS"]
steps:
  - "Проверьте, что мобильный интернет работает без VPN"
  - "Установите или обновите официальное приложение VPN"
  - "Войдите в приложение под корпоративной учётной записью"
  - "Разрешите установку VPN-профиля в настройках устройства"
  - "Подключитесь к профилю corp-vpn"
escalate_if: "приложение VPN не устанавливается или не подключается после переустановки"