id: KB-VPN-004
category: VPN
title: VPN работает очень медленно
symptoms:
  - "vpn тормозит"
  - "через впн всё медленно"
  - "низкая скорость при подключённом vpn"
  - "впн режет скорость"
  - "медленно грузит корпоративные ресурсы через vpn"
steps:
  - "Замерьте скорость без VPN и с VPN — сравните разницу"
  - "Попробуйте другой сервер или профиль в приложении VPN, если есть выбор"
  - "Переключитесь с Wi-Fi на кабель"
  - "Закройте лишние приложения, которые качают трафик"
  - "Переподключитесь к VPN"
escalate_if: "скорость через VPN падает более чем в 5 раз на кабельном интернете"