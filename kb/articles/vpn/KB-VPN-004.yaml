id: KB-VPN-004
category: VPN
title: VPN работает очень медленно
symptoms:
  - "vpn тормозит"
  - "через впн всё медленно"
  - "низкая скорость при подключённом vpn"
  - "впн режет скорость"
  - "медленно грузит корпоративные ресурсы через vpn"
steps:
  - "Отключите VPN и откройте знакомый вам сервис проверки скорости в браузере, затем повторите проверку после подключения VPN — результаты покажут разницу между обычным и VPN-соединением."
  - "Откройте список серверов или профилей в приложении VPN и выберите другой доступный вариант — после подключения скорость может измениться."
  - "Подключите компьютер к интернету кабелем вместо Wi-Fi — если страницы начнут загружаться быстрее, причиной была слабая или перегруженная беспроводная сеть."
  - "Закройте программы, которые загружают или передают большие объёмы данных, через их обычное меню — после этого интернет-канал освободится для VPN."
  - "Откройте главное окно приложения VPN, отключитесь и снова подключитесь к выбранному профилю — после повторного подключения проверьте скорость загрузки корпоративных ресурсов."
escalate_if: "Обратитесь в техподдержку, если VPN остаётся медленным при стабильном интернете, закрытых программах и разных доступных профилях."
