id: KB-VPN-001
category: VPN
title: Не подключается корпоративный VPN
symptoms:
  - "не работает vpn"
  - "не могу подключиться к впн"
  - "впн выдаёт ошибку"
  - "vpn отваливается при подключении"
  - "корпоративный впн не коннектится"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
  - key: error_code
    question: "Есть ли код ошибки на экране? Если да — какой?"
    optional: true
steps:
  - "Откройте браузер без подключения к VPN и загрузите любой знакомый сайт — если сайт открывается, обычный интернет работает."
  - "Полностью закройте приложение VPN через его меню или значок в области уведомлений и запустите его снова — появится главное окно приложения без прежней попытки подключения."
  - "Откройте в приложении VPN раздел «Настройки», выберите «Профиль» и найдите строку «Сертификат» — рядом будет указана дата окончания его действия."
  - "В списке профилей приложения VPN выберите «corp-vpn» и нажмите «Подключиться» — приложение покажет состояние подключения или повторит сообщение об ошибке."
escalate_if: "Обратитесь в техподдержку, если интернет работает, сертификат действителен, а профиль «corp-vpn» по-прежнему не подключается."
