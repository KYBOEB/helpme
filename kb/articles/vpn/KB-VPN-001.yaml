id: KB-VPN-001
category: VPN
title: Не подключается корпоративный VPN
symptoms:
  - "не работает vpn"
  - "не могу подключиться к впн"
  - "впн выдаёт ошибку"
  - "vpn отваливается при подключении"
  - "корпоративный впн не коннектится"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
  - key: error_code
    question: "Есть ли код ошибки на экране? Если да — какой?"
    optional: true
steps:
  - "Проверьте интернет без VPN — откройте любой сайт"
  - "Закройте приложение VPN полностью и запустите заново"
  - "Проверьте срок действия сертификата: Настройки → Профиль"
  - "Переподключитесь к профилю corp-vpn"
escalate_if: "после всех шагов подключение не восстановилось"