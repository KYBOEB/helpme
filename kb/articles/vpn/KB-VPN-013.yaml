id: KB-VPN-013
category: VPN
title: Ошибка аутентификации при подключении к VPN
symptoms:
  - "vpn пишет ошибка аутентификации"
  - "впн не принимает логин"
  - "authentication failed в vpn"
steps:
  - "Откройте страницу входа в корпоративную учётную запись и проверьте, что имя пользователя введено без лишних пробелов, а пароль набирается в правильной раскладке клавиатуры."
  - "В окне VPN введите учётные данные заново и нажмите «Подключиться» — при успешной проверке появится активное VPN-соединение."
  - "Проверьте уведомления на телефоне или компьютере, где подтверждается вход в учётную запись, и подтвердите запрос, если он относится к вашей попытке подключения."
  - "Откройте настройки даты и времени операционной системы и включите автоматическую установку времени — после синхронизации снова попробуйте подключиться к VPN."
escalate_if: "Обратитесь в техподдержку, если правильные учётные данные и подтверждение входа не помогают подключиться к VPN."
