id: KB-SOFT-018
category: программное обеспечение
title: Не открываются ссылки из письма
symptoms:
  - "ссылка из письма не открывается"
  - "при клике ничего не происходит"
  - "браузер не запускается из почты"
steps:
  - "Проверьте подключение к интернету, открыв любой знакомый сайт в браузере — сайт должен загрузиться без сообщения об отсутствии соединения."
  - "Откройте письмо и наведите указатель на ссылку, не нажимая её — внизу окна или рядом с указателем появится адрес ссылки, по которому можно проверить, куда она ведёт."
  - "Скопируйте ссылку через пункт «Копировать ссылку» в меню ссылки и вставьте её в адресную строку браузера — браузер покажет введённый адрес перед переходом."
  - "Откройте ссылку клавишей Enter в адресной строке браузера — нужная страница загрузится или появится сообщение, объясняющее причину ошибки."
  - "Перезапустите почтовую программу через меню «Файл» или команду «Выйти», а затем откройте её снова — ссылки из новых писем снова будут открываться в браузере."
escalate_if: "Обратитесь в техподдержку, если браузер не запускается вручную, ссылка ведёт на рабочий ресурс с ошибкой доступа или проблема повторяется в разных письмах."
