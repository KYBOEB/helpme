id: KB-SOFT-006
category: программное обеспечение
title: Программа не видит корпоративный ресурс или диск
symptoms:
  - "программа не видит сетевой диск"
  - "приложение не открывает файл с сервера"
  - "не подключается к корпоративному серверу из программы"
  - "не вижу корпоративные ресурсы в приложении"
  - "программа не находит общую папку"
required_slots:
  - key: app
    question: "В какой программе проблема?"
    optional: true
steps:
  - "Проверьте, что компьютер в корпоративной сети или подключён к VPN"
  - "Откройте сетевой диск через проводник — убедитесь, что он доступен"
  - "Перезапустите программу"
  - "Переподключите сетевой диск: правой кнопкой → «Подключить сетевой диск»"
  - "Перезагрузите компьютер"
escalate_if: "сетевой ресурс не виден и в проводнике"