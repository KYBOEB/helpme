id: KB-SOFT-006
category: программное обеспечение
title: Программа не видит корпоративный ресурс или диск
symptoms:
  - "программа не видит сетевой диск"
  - "приложение не открывает файл с сервера"
  - "не подключается к корпоративному серверу из программы"
  - "не вижу корпоративные ресурсы в приложении"
  - "программа не находит общую папку"
required_slots:
  - key: app
    question: "В какой программе проблема?"
    optional: true
steps:
  - "Подключите компьютер к корпоративной сети или запустите VPN-программу и нажмите «Подключиться» — после подключения корпоративные ресурсы должны стать доступными."
  - "Откройте «Проводник», выберите «Этот компьютер» и откройте нужный сетевой диск — если диск доступен, его содержимое появится в окне."
  - "Закройте программу через кнопку «Закрыть» в правом верхнем углу окна и снова запустите её из меню «Пуск» — проверьте, появился ли корпоративный ресурс."
  - "В «Проводнике» щёлкните правой кнопкой мыши по «Этот компьютер», выберите «Подключить сетевой диск» и укажите ранее использовавшийся диск — после подключения он снова появится в разделе «Этот компьютер»."
  - "Откройте меню «Пуск», нажмите кнопку питания и выберите «Перезагрузка» — после запуска Windows снова проверьте сетевой диск и программу."
escalate_if: "Если сетевой диск не открывается в «Проводнике» или не появляется в программе после подключения к сети и перезагрузки, обратитесь в техподдержку."
