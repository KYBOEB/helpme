id: KB-SOFT-014
category: программное обеспечение
title: Ошибка при открытии файла с общего диска
symptoms:
  - "файл на сетевом диске не открывается"
  - "пишет что файл занят другим пользователем"
  - "документ с общей папки выдаёт ошибку"
steps:
  - "Откройте Проводник и перейдите к нужному общему диску или сетевой папке — проверьте, отображаются ли там сам диск, папка и нужный файл."
  - "Нажмите в Проводнике кнопку «Обновить» и повторно откройте файл двойным щелчком — если файл был временно занят или соединение прервалось, он может открыться после обновления."
  - "Откройте в этой же общей папке другой небольшой файл — если он тоже не открывается, проблема, скорее всего, связана с подключением или доступом к диску."
  - "Посмотрите на сообщение об ошибке и сведения о файле в окне «Свойства», которое открывается через правую кнопку мыши по файлу — там может быть указано, что файл доступен только для чтения или используется другим пользователем."
  - "Закройте файл во всех открытых программах на своём компьютере и повторите попытку через несколько минут — сообщение о блокировке исчезнет, если файл был занят вашим сеансом."
escalate_if: "Обратитесь в техподдержку, если общий диск не открывается, файл остаётся заблокированным другим пользователем или ошибка появляется только у этого файла."
