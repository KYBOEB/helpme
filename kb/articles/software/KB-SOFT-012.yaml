id: KB-SOFT-012
category: программное обеспечение
title: Не работает электронная подпись в программе
symptoms:
  - "не подписывается документ"
  - "программа не видит подпись"
  - "ошибка при подписании файла"
steps:
  - "Подключите электронный ключ, смарт-карту или другое устройство для подписи к компьютеру и откройте программу, после чего проверьте, появилось ли устройство в разделе «Сертификаты», «Подпись» или «Криптография»."
  - "Откройте в программе список сертификатов для подписания документа и выберите сертификат с вашей фамилией и действующей датой, после чего повторите подписание."
  - "Откройте сведения о выбранном сертификате в окне «Свойства» или «Просмотр сертификата» и проверьте срок действия, после чего используйте другой действующий сертификат, если текущий просрочен."
  - "Закройте программу, отключите устройство для подписи, подключите его снова и запустите программу через меню приложений, после чего повторите операцию подписания."
  - "Откройте системные настройки даты и времени и включите автоматическую установку времени, после чего перезапустите программу и снова попробуйте подписать документ."
escalate_if: "Обратитесь в техподдержку, если устройство или действующий сертификат не отображается либо программа показывает ошибку при подписании."
