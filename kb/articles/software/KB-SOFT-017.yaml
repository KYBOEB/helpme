id: KB-SOFT-017
category: программное обеспечение
title: Нужно установить программу на личный ноутбук
symptoms:
  - "можно ли поставить рабочую программу на свой ноут"
  - "нужна программа на домашнем компьютере"
  - "установка на личное устройство"
steps:
  - "Уточните название программы и требования к личному ноутбуку на странице входа в корпоративную учётную запись или на официальном сайте разработчика — вы увидите, поддерживается ли ваше устройство и нужна ли лицензия."
  - "Скачайте установочный файл с официального сайта разработчика или из разрешённого источника, который указан на странице программы — файл появится в папке «Загрузки»."
  - "Откройте установочный файл в папке «Загрузки» и следуйте подсказкам мастера установки — программа появится в меню «Пуск» или в папке «Программы»."
  - "Запустите программу и войдите с рабочей учётной записью, если она этого попросит — откроется окно программы или сообщение о необходимости активации."
escalate_if: "Обратитесь в техподдержку, если программа требует неизвестный ключ, не устанавливается или для личного устройства нужна отдельная лицензия."
