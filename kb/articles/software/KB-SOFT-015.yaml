id: KB-SOFT-015
category: программное обеспечение
title: Файл не сохраняется
symptoms:
  - "не даёт сохранить документ"
  - "при сохранении ошибка доступа"
  - "изменения не сохраняются"
steps:
  - "Откройте в программе меню «Файл», выберите «Сохранить как», укажите папку «Документы» и задайте новое имя файла — если документ сохранится, проблема связана с прежней папкой или именем файла."
  - "Откройте проводник, выберите «Этот компьютер» и проверьте свободное место на диске — рядом с диском будет показан доступный объём, и при почти заполненном диске файл не сохранится."
  - "Откройте свойства исходного файла через контекстное меню, найдите на вкладке «Общие» пункт «Только для чтения» и снимите его, если он отмечен, — после этого файл можно будет изменить и сохранить."
  - "Создайте в программе новый документ, перенесите в него нужное содержимое и сохраните его в папке «Документы» — если новый файл сохраняется, исходный документ, вероятно, повреждён или открыт с ограничениями."
escalate_if: "Обратитесь в техподдержку, если новый файл не сохраняется даже в папке «Документы» или появляется сообщение с кодом ошибки."
