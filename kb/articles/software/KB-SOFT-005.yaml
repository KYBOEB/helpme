id: KB-SOFT-005
category: программное обеспечение
title: Программа вылетает с ошибкой во время работы
symptoms:
  - "программа вылетает"
  - "приложение закрывается само"
  - "прога крашится"
  - "во время работы программа выдает ошибку и закрывается"
  - "вылетает с ошибкой при сохранении"
required_slots:
  - key: app
    question: "Какая программа вылетает?"
    optional: true
  - key: when
    question: "Когда именно происходит вылет?"
    options: ["Сразу при запуске", "Во время работы", "При сохранении файла", "При открытии файла"]
steps:
  - "Сохраните текущую работу, если она ещё открыта"
  - "Перезапустите программу"
  - "Проверьте, хватает ли свободного места на диске"
  - "Обновите программу до последней версии"
  - "Если вылет повторяется на конкретном файле — попробуйте открыть другой файл"
escalate_if: "программа вылетает регулярно на разных файлах"