id: KB-SOFT-005
category: программное обеспечение
title: Программа вылетает с ошибкой во время работы
symptoms:
  - "программа вылетает"
  - "приложение закрывается само"
  - "прога крашится"
  - "во время работы программа выдает ошибку и закрывается"
  - "вылетает с ошибкой при сохранении"
required_slots:
  - key: app
    question: "Какая программа вылетает?"
    optional: true
  - key: when
    question: "Когда именно происходит вылет?"
    options: ["Сразу при запуске", "Во время работы", "При сохранении файла", "При открытии файла"]
steps:
  - "Сохраните текущую работу кнопкой «Сохранить» в верхней панели программы, если окно ещё отвечает, — последние изменения останутся в файле."
  - "Закройте программу обычным способом через меню «Файл» или кнопку «Закрыть» и снова запустите её из меню «Пуск» — проверьте, повторяется ли вылет."
  - "Откройте «Проводник», выберите «Этот компьютер» и посмотрите на свободное место под системным диском — на диске должно быть достаточно свободного пространства для работы программы."
  - "Откройте в программе меню «Справка» или «О программе» и выберите пункт «Проверить обновления» — при наличии новой версии появится предложение установить её."
  - "Откройте другой файл через меню «Файл» и пункт «Открыть» — если другой файл открывается нормально, проблема, вероятно, связана с конкретным файлом."
escalate_if: "Если программа продолжает закрываться на разных файлах после перезапуска и обновления, обратитесь в техподдержку и укажите, при каком действии происходит вылет."
