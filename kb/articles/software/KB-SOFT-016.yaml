id: KB-SOFT-016
category: программное обеспечение
title: Антивирус блокирует нужную программу
symptoms:
  - "антивирус удалил файл"
  - "защита не даёт запустить программу"
  - "система блокирует установку"
steps:
  - "Откройте установленный антивирус, перейдите в раздел «Журнал», «История защиты» или «Карантин» и найдите запись о нужной программе — там будут указаны причина блокировки и название обнаружения."
  - "Откройте сайт разработчика программы или страницу, с которой вы обычно получаете рабочее программное обеспечение, и проверьте сведения о файле — название издателя и цифровая подпись должны соответствовать ожидаемой программе."
  - "Щёлкните файл программы правой кнопкой мыши, выберите пункт проверки антивирусом и дождитесь окончания проверки — антивирус сообщит, обнаружена ли угроза."
  - "Откройте в антивирусе раздел обновления баз и нажмите «Проверить обновления» — программа покажет дату последнего обновления и установит доступные исправления."
escalate_if: "Обратитесь в техподдержку, не восстанавливая файл из карантина и не добавляя исключение, если антивирус продолжает блокировать программу."
