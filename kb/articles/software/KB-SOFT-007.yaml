id: KB-SOFT-007
category: программное обеспечение
title: После обновления Windows перестали работать программы
symptoms:
  - "после обновления виндовс программы не работают"
  - "обновилась винда и всё сломалось"
  - "приложения перестали запускаться после апдейта"
  - "после обновления системы не открывается почта"
  - "windows обновился и программы вылетают"
steps:
  - "Перезагрузите компьютер через меню «Пуск» и «Питание», после запуска Windows проверьте, открывается ли нужная программа."
  - "Запустите другую программу через меню «Пуск» и сравните результат, чтобы понять, не связана ли проблема только с одним приложением."
  - "Откройте «Параметры» Windows, выберите «Приложения» и найдите неисправную программу в списке установленных приложений — рядом с ней будут доступны дополнительные параметры."
  - "Откройте «Дополнительные параметры» этой программы в разделе «Приложения» и нажмите «Исправить», после чего Windows попробует восстановить приложение без удаления его данных."
  - "Откройте «Параметры» Windows, выберите «Windows Update» и нажмите «Проверить наличие обновлений», чтобы установить исправления, которые могут вернуть совместимость программ."
escalate_if: "Обратитесь в техподдержку, если после этих действий несколько программ по-прежнему не запускаются или сразу закрываются."
