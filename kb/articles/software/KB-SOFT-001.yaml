id: KB-SOFT-001
category: программное обеспечение
title: Программа не запускается
symptoms:
  - "программа не запускается"
  - "приложение не открывается"
  - "не могу запустить программу"
  - "прога вылетает при запуске"
  - "двойной клик а ничего не происходит"
required_slots:
  - key: app
    question: "Какая программа не запускается?"
    optional: true
steps:
  - "Закройте программу через диспетчер задач и запустите снова"
  - "Перезагрузите компьютер"
  - "Проверьте, что программа установлена корректно — запустите её от имени администратора"
  - "Проверьте, хватает ли свободного места на диске"
  - "Обновите программу до последней версии"
escalate_if: "программа не запускается после переустановки"