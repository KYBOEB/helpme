id: KB-SOFT-001
category: программное обеспечение
title: Программа не запускается
symptoms:
  - "программа не запускается"
  - "приложение не открывается"
  - "не могу запустить программу"
  - "прога вылетает при запуске"
  - "двойной клик а ничего не происходит"
required_slots:
  - key: app
    question: "Какая программа не запускается?"
    optional: true
steps:
  - "Откройте диспетчер задач сочетанием клавиш «Ctrl» + «Shift» + «Esc», найдите в списке программу app и нажмите «Снять задачу», после чего программа полностью закроется."
  - "Найдите app в меню «Пуск» и запустите программу снова, после чего должно появиться её рабочее окно без прежнего зависания."
  - "Перезагрузите компьютер через меню «Пуск» и после входа в систему снова откройте app, чтобы проверить запуск после обновления системных служб."
  - "Нажмите правой кнопкой мыши значок app в меню «Пуск», выберите «Дополнительно» и «Запуск от имени администратора», после чего появится запрос разрешения или откроется программа."
  - "Откройте проводник и проверьте свободное место на системном диске в разделе «Этот компьютер», где должно оставаться достаточно места для запуска программы."
  - "Откройте app и найдите пункт «Проверить обновления» в меню «Справка» или «Настройки», после чего программа сообщит о доступном обновлении или подтвердит, что используется последняя версия."
escalate_if: "Обратитесь в техподдержку, если app не запускается после этих проверок или сразу закрывается с сообщением об ошибке."
