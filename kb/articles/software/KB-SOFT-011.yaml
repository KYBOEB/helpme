id: KB-SOFT-011
category: программное обеспечение
title: Не печатается PDF
symptoms:
  - "pdf не отправляется на печать"
  - "печатает пдф иероглифами"
  - "документ pdf не печатается"
steps:
  - "Откройте PDF в программе для просмотра документов и нажмите кнопку «Печать» или сочетание клавиш «Ctrl+P», после чего выберите нужный принтер в списке и проверьте предварительный просмотр."
  - "В окне печати откройте список «Принтер» или «Выбор принтера» и выберите физическое устройство вместо пункта «Microsoft Print to PDF» или другого виртуального принтера, после чего отправьте документ на печать."
  - "Откройте в окне печати раздел «Дополнительно» или «Advanced» и включите параметр «Печатать как изображение», после чего повторите печать PDF."
  - "Откройте другой небольшой PDF-файл в той же программе и отправьте его на печать, чтобы увидеть, печатается ли только проблемный документ или не работает сам принтер."
  - "Откройте системные настройки принтеров, выберите нужный принтер и проверьте очередь печати, после чего отмените только зависшее задание и повторите печать документа."
escalate_if: "Обратитесь в техподдержку, если другие документы тоже не печатаются или PDF продолжает выводиться иероглифами после включения печати как изображения."
