id: KB-SOFT-019
category: программное обеспечение
title: Не открывается корпоративная справочная система в браузере
symptoms:
  - "справочная система не грузится"
  - "белый экран вместо системы"
  - "система висит на загрузке"
  - "не открываются документы в справочной системе"
  - "страница системы не отвечает"
steps:
  - "Обновите страницу с очисткой кэша: нажмите Ctrl+F5 на Windows или Cmd+Shift+R на macOS — чаще всего белый экран лечится именно этим"
  - "Откройте систему в окне без расширений (в Chrome это «Новое окно в режиме инкогнито») — блокировщики рекламы и корпоративные расширения нередко вырезают часть страницы"
  - "Проверьте, открывается ли любой другой рабочий сайт: если не открывается ничего, проблема в сети, а не в системе"
  - "Попробуйте другой браузер: если там всё работает, дело в настройках первого, и его достаточно обновить до последней версии"
  - "Если система открывается, но документы внутри не показываются, разрешите всплывающие окна для этого сайта — документы часто открываются отдельной вкладкой"
escalate_if: "система не открывается ни в одном браузере при рабочем интернете"
