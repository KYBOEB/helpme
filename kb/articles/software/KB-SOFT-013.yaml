id: KB-SOFT-013
category: программное обеспечение
title: Корпоративная система работает очень медленно
symptoms:
  - "система еле ворочается"
  - "долго открываются справочники"
  - "программа тормозит весь день"
steps:
  - "Закройте корпоративную систему обычной кнопкой «Выход» или крестиком окна и запустите её снова через ярлык программы — после повторного запуска проверьте скорость открытия справочников."
  - "Откройте браузер или другую сетевую программу на этом же компьютере и загрузите знакомую страницу — если она тоже открывается медленно, причина может быть в подключении к сети."
  - "Закройте лишние программы и вкладки, которые сейчас не нужны, через их обычные кнопки закрытия — корпоративная система получит больше ресурсов и может начать работать быстрее."
  - "Нажмите сочетание клавиш Ctrl+Shift+Esc, откройте «Диспетчер задач» и выберите вкладку «Процессы» — по столбцам «ЦП», «Память» и «Сеть» будет видно, не занята ли система другой программой."
  - "Перезагрузите компьютер через меню «Пуск» и команду «Перезагрузка» — после запуска снова войдите в корпоративную систему и проверьте, сохраняется ли задержка."
escalate_if: "Обратитесь в техподдержку, если система остаётся медленной после перезапуска и проблема повторяется у других пользователей или на разных компьютерах."
