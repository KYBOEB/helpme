id: KB-SOFT-008
category: программное обеспечение
title: Не открывается документ Word или Excel
symptoms:
  - "не открывается документ"
  - "файл не запускается"
  - "excel пишет ошибку при открытии"
steps:
  - "Откройте Word или Excel через меню «Пуск» и создайте пустой документ, после чего станет понятно, запускается ли сама программа."
  - "Выберите в открытой программе пункт «Файл», затем «Открыть» и нужный документ, после чего файл либо откроется, либо появится сообщение с причиной ошибки."
  - "Сохраните копию документа под другим именем через пункт «Файл» и «Сохранить как», после чего попробуйте открыть именно эту копию."
  - "Перезагрузите компьютер через меню «Пуск» и «Питание», после чего снова откройте Word или Excel и проверьте документ."
  - "Запишите точный текст ошибки и название файла в окне Word или Excel, чтобы специалист мог определить причину проблемы."
escalate_if: "Обратитесь в техподдержку, если программа не запускается или документ не открывается после перезагрузки и создания копии."
