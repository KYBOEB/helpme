id: KB-SOFT-004
category: программное обеспечение
title: Слетела лицензия на программу
symptoms:
  - "слетела лицензия"
  - "программа просит активацию"
  - "лицензия истекла"
  - "приложение пишет нет лицензии"
  - "не активируется программа"
required_slots:
  - key: app
    question: "На какую программу слетела лицензия?"
    optional: true
steps:
  - "Закройте и снова откройте программу"
  - "Проверьте, что компьютер в корпоративной сети или подключён к VPN"
  - "Войдите в программу под корпоративной учётной записью"
  - "Дождитесь автоматической проверки лицензии — обычно это 1–2 минуты"
  - "Перезапустите программу"
escalate_if: "лицензия не восстанавливается после переподключения к сети"