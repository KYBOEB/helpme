id: KB-SOFT-004
category: программное обеспечение
title: Слетела лицензия на программу
symptoms:
  - "слетела лицензия"
  - "программа просит активацию"
  - "лицензия истекла"
  - "приложение пишет нет лицензии"
  - "не активируется программа"
required_slots:
  - key: app
    question: "На какую программу слетела лицензия?"
    optional: true
steps:
  - "Закройте программу через кнопку «Закрыть» в правом верхнем углу окна и снова запустите её из меню «Пуск» — проверьте, исчезло ли сообщение о лицензии."
  - "Подключите компьютер к корпоративной сети или запустите VPN-программу и нажмите «Подключиться» — после подключения появится сообщение об успешном соединении."
  - "Откройте в программе меню учётной записи или профиля и войдите под корпоративной учётной записью — программа должна показать ваше имя или рабочий адрес."
  - "Оставьте программу открытой на одну-две минуты после входа — она должна автоматически проверить лицензию и перестать запрашивать активацию."
  - "Перезапустите программу через меню «Файл» или закрыв её обычным способом — после повторного запуска проверьте, открывается ли она без сообщения об ошибке лицензии."
escalate_if: "Если программа по-прежнему требует активацию после подключения к сети и входа в корпоративную учётную запись, обратитесь в техподдержку."
