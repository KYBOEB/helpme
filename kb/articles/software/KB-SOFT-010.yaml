id: KB-SOFT-010
category: программное обеспечение
title: Программа требует лицензию после переустановки
symptoms:
  - "после переустановки просит ключ"
  - "лицензия слетела"
  - "программа стала пробной версией"
steps:
  - "Откройте программу через меню приложений и перейдите в раздел «Учётная запись», «Профиль» или «Лицензия», где будет указано, выполнена ли активация."
  - "В окне программы выберите «Войти» или «Активировать» и используйте ту рабочую учётную запись, с которой лицензия применялась до переустановки, после чего проверьте, исчезло ли сообщение о пробной версии."
  - "Откройте меню «Справка» или «О программе» и выберите «Проверить обновления», после чего перезапустите программу и проверьте состояние лицензии ещё раз."
  - "Если программа предлагает ввести ключ, сохраните это окно открытым и проверьте, нет ли в нём варианта «Войти» или «Активировать через учётную запись», чтобы не вводить случайный ключ."
escalate_if: "Обратитесь в техподдержку, если рабочая учётная запись не активирует программу или у вас нет предоставленного организацией ключа."
