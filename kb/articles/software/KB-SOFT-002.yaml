id: KB-SOFT-002
category: программное обеспечение
title: Нужно установить новое ПО
symptoms:
  - "нужно установить программу"
  - "как поставить новое по"
  - "прошу установить приложение"
  - "нужна программа для работы"
  - "хочу установить софт"
steps:
  - "Откройте корпоративный каталог ПО на странице входа в корпоративную учётную запись и найдите нужную программу, после чего станет видно, доступна ли она для самостоятельной установки."
  - "Если программы нет в каталоге, откройте портал заявок и выберите форму запроса на установку программного обеспечения, после чего появятся поля для оформления заявки."
  - "Укажите в заявке название программы, нужную версию и рабочее обоснование установки, после чего эти сведения будут отображаться перед отправкой запроса."
  - "Отправьте заявку и согласуйте её с руководителем через доступный в заявке способ, после чего её статус должен измениться на согласованный или переданный на рассмотрение."
  - "После одобрения оставьте компьютер подключённым к сети и дождитесь автоматической установки, после чего программа появится в меню «Пуск» или списке установленных приложений."
escalate_if: "Обратитесь в техподдержку, если программа отсутствует в каталоге, заявка не отправляется или установка не начинается после одобрения."
