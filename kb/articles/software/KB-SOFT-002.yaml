id: KB-SOFT-002
category: программное обеспечение
title: Нужно установить новое ПО
symptoms:
  - "нужно установить программу"
  - "как поставить новое по"
  - "прошу установить приложение"
  - "нужна программа для работы"
  - "хочу установить софт"
steps:
  - "Проверьте, есть ли нужная программа в корпоративном каталоге ПО"
  - "Откройте портал заявок и оформите заявку на установку"
  - "Укажите название программы, версию и обоснование"
  - "Согласуйте заявку с руководителем"
  - "После одобрения дождитесь установки — она пройдёт автоматически"
escalate_if: "нужной программы нет в корпоративном каталоге"