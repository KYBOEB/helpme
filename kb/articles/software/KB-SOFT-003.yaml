id: KB-SOFT-003
category: программное обеспечение
title: Ошибка при обновлении программы
symptoms:
  - "ошибка обновления"
  - "не обновляется программа"
  - "приложение не может обновиться"
  - "слетело обновление"
  - "update failed"
required_slots:
  - key: app
    question: "Какая программа не обновляется?"
    optional: true
steps:
  - "Закройте программу полностью через диспетчер задач"
  - "Проверьте интернет — откройте любой сайт"
  - "Запустите обновление от имени администратора"
  - "Если не помогает — удалите программу и установите заново из корпоративного каталога"
  - "Перезагрузите компьютер"
escalate_if: "обновление падает с ошибкой после переустановки"