id: KB-SOFT-003
category: программное обеспечение
title: Ошибка при обновлении программы
symptoms:
  - "ошибка обновления"
  - "не обновляется программа"
  - "приложение не может обновиться"
  - "слетело обновление"
  - "update failed"
required_slots:
  - key: app
    question: "Какая программа не обновляется?"
    optional: true
steps:
  - "Закройте программу через «Диспетчер задач» Windows, открыв его сочетанием клавиш Ctrl+Shift+Esc и завершив процесс нужного приложения — программа исчезнет из списка запущенных приложений."
  - "Откройте любой сайт в браузере — страница должна загрузиться без сообщения об отсутствии подключения."
  - "Запустите программу от имени администратора через её контекстное меню — после подтверждения запроса Windows приложение откроется с повышенными правами."
  - "Откройте в программе раздел «Справка», «Настройки» или «О программе» и снова запустите проверку обновлений — появится сообщение об успешном обновлении либо новый текст ошибки."
  - "Перезагрузите компьютер через меню «Пуск» и после входа в систему повторите обновление программы — временный сбой должен исчезнуть, а обновление должно начаться заново."
escalate_if: "Обратитесь в техподдержку, если программа не обновляется после перезагрузки и повторной проверки интернет-соединения."
