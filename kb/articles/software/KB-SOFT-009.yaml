id: KB-SOFT-009
category: программное обеспечение
title: Не работает программа для видеоконференций
symptoms:
  - "не заходит в конференцию"
  - "видеосвязь не запускается"
  - "не подключается к онлайн встрече"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Проверьте подключение к интернету, открыв в браузере любую знакомую веб-страницу, и если она не загружается, подключитесь к другой сети или перезапустите Wi‑Fi."
  - "Закройте программу для видеоконференций и снова откройте её через меню приложений, после чего повторно войдите в конференцию и проверьте подключение."
  - "Откройте настройки программы для видеоконференций, найдите разделы «Камера», «Микрофон» и «Разрешения» и убедитесь, что выбраны нужные устройства и доступ к ним разрешён."
  - "Откройте страницу входа в корпоративную учётную запись в браузере и войдите под своей рабочей учётной записью, после чего снова запустите конференцию из программы или браузера."
escalate_if: "Обратитесь в техподдержку, если интернет работает, но программа по-прежнему не подключается или показывает код ошибки."
