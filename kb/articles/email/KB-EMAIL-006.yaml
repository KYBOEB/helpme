id: KB-EMAIL-006
category: корпоративная почта
title: Не открывается почта в браузере
symptoms:
  - "веб почта не грузится"
  - "страница почты белая"
  - "не заходит в почту через браузер"
steps:
  - "Обновите страницу почты сочетанием клавиш Ctrl+R в окне браузера — вместо белой страницы появится содержимое почты или сообщение об ошибке."
  - "Откройте страницу почты в режиме инкогнито через меню браузера — если почта загрузится, причиной, скорее всего, является расширение или сохранённые данные обычного окна."
  - "Откройте страницу почты в другом браузере на этом же компьютере — результат покажет, связана ли проблема с текущим браузером."
  - "Войдите в корпоративную учётную запись на странице входа и снова откройте почту — вы увидите, принимаются ли ваши данные для входа и появляется ли сообщение о причине отказа."
escalate_if: "Обратитесь в техподдержку, если почта не открывается в разных браузерах или появляется сообщение о недоступности сервиса."
