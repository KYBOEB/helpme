id: KB-EMAIL-011
category: корпоративная почта
title: Пропали письма из папки
symptoms:
  - "исчезли письма"
  - "пропала переписка из папки"
  - "письма удалились сами"
steps:
  - "Откройте папку «Удалённые» в почтовой программе или на странице входа в корпоративную почту и проверьте, находятся ли пропавшие письма там."
  - "Воспользуйтесь строкой поиска в верхней части почты и укажите отправителя, тему или слово из письма — система покажет сообщения, которые находятся в других папках."
  - "Проверьте папки «Архив», «Спам» и «Нежелательная почта» в списке папок почтового ящика — пропавшая переписка может оказаться в одной из них."
  - "Откройте настройки почты и найдите раздел «Правила», «Фильтры» или «Сортировка» — там будут видны условия, из-за которых новые письма автоматически перемещаются в другую папку."
  - "Откройте корпоративную почту в браузере вместо почтовой программы или наоборот — если письма видны только в одном месте, проблема связана с синхронизацией программы."
escalate_if: "Обратитесь в техподдержку, если писем нет в поиске, удалённых и других папках или они исчезли во всех вариантах доступа к почте."
