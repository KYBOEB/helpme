id: KB-EMAIL-012
category: корпоративная почта
title: Почта не синхронизируется в программе на компьютере
symptoms:
  - "в браузере письма есть, в программе нет"
  - "почтовый клиент не обновляет письма"
  - "не синхронизируется почта на компьютере"
required_slots:
  - key: os
    question: "На каком устройстве проблема?"
    options: ["Windows", "macOS", "Android", "iOS"]
steps:
  - "Проверьте подключение к интернету и откройте в браузере страницу входа в корпоративную почту — если письма открываются, интернет и доступ к ящику работают."
  - "Запустите почтовую программу на компьютере и нажмите «Обновить», «Синхронизировать» или «Отправить и получить» — программа начнёт проверять новые сообщения."
  - "Закройте почтовую программу обычной кнопкой закрытия и снова откройте её — после запуска появятся письма, если проблема была временной."
  - "Откройте в программе раздел «Настройки» или «Параметры учётной записи» и проверьте состояние корпоративной учётной записи — рядом с ней не должно быть сообщения «Отключено», «Ошибка» или «Требуется пароль»."
  - "Откройте письмо в браузере и сравните список папок с программой на компьютере — если папки или письма отсутствуют только в программе, причина связана с её настройками синхронизации."
escalate_if: "Обратитесь в техподдержку, если почта открывается в браузере, но программа показывает ошибку синхронизации после обновления и перезапуска."
