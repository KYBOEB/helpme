id: KB-EMAIL-008
category: корпоративная почта
title: Не прикрепляется большой файл
symptoms:
  - "не отправляется письмо с вложением"
  - "файл слишком большой для письма"
  - "вложение не прикрепляется"
steps:
  - "Откройте свойства файла в проводнике или файловом менеджере — в строке «Размер» будет указано, не превышает ли файл допустимый для письма объём."
  - "Создайте сжатую копию файла через пункт «Сжать» или «Отправить» в контекстном меню файла — рядом появится архив, который обычно занимает меньше места."
  - "Прикрепите архив в окне создания письма через кнопку «Прикрепить файл» или значок скрепки — почта покажет имя и размер вложения."
  - "Загрузите файл в доступное вам корпоративное хранилище и добавьте в письмо ссылку на него через поле текста сообщения — получатель сможет открыть файл без отправки самого вложения."
escalate_if: "Обратитесь в техподдержку, если почта отклоняет даже небольшой файл или у вас нет доступного корпоративного хранилища для передачи большого файла."
