id: KB-EMAIL-016
category: корпоративная почта
title: Нужен доступ к почте сотрудника, который уволился
symptoms:
  - "сотрудник уволился, нужна его переписка"
  - "как получить доступ к ящику бывшего коллеги"
  - "нужен архив почты уволенного"
steps:
  - "Уточните у руководителя, какие письма или период переписки нужны, чтобы запрос на доступ имел ограниченный и понятный объём."
  - "Подготовьте для обращения в техподдержку имя бывшего сотрудника, его рабочий адрес, нужный период и цель получения переписки, чтобы специалист мог проверить допустимый способ доступа."
  - "Попросите руководителя подтвердить необходимость доступа через согласованный университетом канал, чтобы обработка почты бывшего сотрудника проходила с необходимым разрешением."
escalate_if: "Обратитесь в техподдержку, если требуется открыть ящик, передать архив или восстановить переписку бывшего сотрудника."
