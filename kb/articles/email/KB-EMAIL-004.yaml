id: KB-EMAIL-004
category: корпоративная почта
title: Письма приходят с задержкой
symptoms:
  - "письма приходят с опозданием"
  - "почта тормозит"
  - "письмо пришло позже"
  - "долго не приходит письмо"
  - "задержка в получении почты"
required_slots:
  - key: client
    question: "Где смотрите почту?"
    options: ["Outlook", "Веб-версия", "Мобильное приложение"]
steps:
  - "Нажмите «Отправить и получить» в почтовом клиенте"
  - "Проверьте интернет — откройте любой сайт"
  - "Проверьте папку «Спам» — письмо могло попасть туда"
  - "Сравните время получения в веб-версии и в клиенте"
  - "Перезапустите почтовый клиент"
escalate_if: "задержки сохраняются и в веб-версии почты"