id: KB-EMAIL-004
category: корпоративная почта
title: Письма приходят с задержкой
symptoms:
  - "письма приходят с опозданием"
  - "почта тормозит"
  - "письмо пришло позже"
  - "долго не приходит письмо"
  - "задержка в получении почты"
required_slots:
  - key: client
    question: "Где смотрите почту?"
    options: ["Outlook", "Веб-версия", "Мобильное приложение"]
steps:
  - "Откройте почтовый клиент и нажмите «Отправить и получить» на панели инструментов, после чего проверьте, появились ли ожидаемые письма."
  - "Откройте любой сайт в браузере, чтобы убедиться, что интернет-соединение работает и задержка связана не с отключением сети."
  - "Откройте папку «Спам» в почтовом клиенте и проверьте наличие ожидаемого письма, после чего переместите его в папку «Входящие», если оно там найдено."
  - "Откройте страницу входа в корпоративную почту в браузере и сравните время появления письма в веб-версии с временем его получения в почтовом клиенте."
  - "Закройте почтовый клиент обычной кнопкой закрытия и снова запустите его из меню приложений, после чего проверьте получение нового письма."
escalate_if: "Обратитесь в техподдержку, если письма задерживаются и в веб-версии, и в почтовом клиенте после проверки соединения."
