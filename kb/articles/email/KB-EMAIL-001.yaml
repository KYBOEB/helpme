id: KB-EMAIL-001
category: корпоративная почта
title: Не отправляются письма
symptoms:
  - "письма не отправляются"
  - "почта не отправляет"
  - "не уходит письмо"
  - "ошибка при отправке письма"
  - "письмо зависло в исходящих"
required_slots:
  - key: client
    question: "Где работаете с почтой?"
    options: ["Outlook", "Веб-версия", "Мобильное приложение"]
steps:
  - "Откройте браузер и загрузите любой известный вам сайт, чтобы убедиться, что интернет-соединение работает."
  - "Откройте папку «Исходящие» в почтовом клиенте и переместите застрявшее письмо в «Черновики», чтобы сохранить его и подготовить к повторной отправке."
  - "Откройте сохранённое письмо в «Черновиках» и проверьте поле «Кому», чтобы в адресе не было опечаток."
  - "Откройте список вложений в этом письме и замените слишком большой файл ссылкой на него, чтобы письмо соответствовало ограничению размера."
  - "Перезапустите почтовый клиент через меню «Файл» или команду «Выход», снова откройте его и отправьте письмо из «Черновиков»."
escalate_if: "Обратитесь в техподдержку, если письма не отправляются после проверки соединения, адреса и вложения."
