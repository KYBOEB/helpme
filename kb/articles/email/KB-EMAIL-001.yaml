id: KB-EMAIL-001
category: корпоративная почта
title: Не отправляются письма
symptoms:
  - "письма не отправляются"
  - "почта не отправляет"
  - "не уходит письмо"
  - "ошибка при отправке письма"
  - "письмо зависло в исходящих"
required_slots:
  - key: client
    question: "Где работаете с почтой?"
    options: ["Outlook", "Веб-версия", "Мобильное приложение"]
steps:
  - "Проверьте интернет — откройте любой сайт"
  - "Проверьте папку «Исходящие»: письмо могло застрять, удалите его и отправьте заново"
  - "Убедитесь, что в поле «Кому» нет опечаток в адресе"
  - "Проверьте размер вложения — большие файлы лучше отправить ссылкой"
  - "Перезапустите почтовый клиент и отправьте письмо ещё раз"
escalate_if: "письма не отправляются после перезапуска и проверки адреса"