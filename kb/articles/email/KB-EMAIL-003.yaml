id: KB-EMAIL-003
category: корпоративная почта
title: Переполнен почтовый ящик
symptoms:
  - "переполнен ящик"
  - "почта не принимает письма ящик полон"
  - "закончилось место в почте"
  - "mailbox full"
  - "не могу получить письмо ящик переполнен"
steps:
  - "Откройте почту и посмотрите текущий размер ящика"
  - "Очистите папку «Удалённые» и «Спам»"
  - "Отсортируйте письма по размеру и удалите самые крупные с вложениями"
  - "Сохраните нужные вложения на диск и удалите письма"
  - "Очистите папку «Отправленные» от старых писем"
escalate_if: "после очистки ящик всё равно переполнен"