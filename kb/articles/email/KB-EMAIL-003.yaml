id: KB-EMAIL-003
category: корпоративная почта
title: Переполнен почтовый ящик
symptoms:
  - "переполнен ящик"
  - "почта не принимает письма ящик полон"
  - "закончилось место в почте"
  - "mailbox full"
  - "не могу получить письмо ящик переполнен"
steps:
  - "Откройте корпоративную почту и найдите сведения о занятом месте в разделе «Настройки» или в области учётной записи, чтобы увидеть текущий размер почтового ящика."
  - "Откройте папки «Удалённые» и «Спам» в списке папок почты и переместите ненужные письма в «Удалённые», чтобы освободить место без окончательного удаления."
  - "Откройте список писем в основной папке, отсортируйте его по размеру и выберите самые крупные сообщения с ненужными вложениями, чтобы понять, какие письма занимают больше всего места."
  - "Скачайте нужные вложения на компьютер через меню письма, а затем переместите соответствующие письма в папку «Удалённые», чтобы сохранить файлы и уменьшить объём почты."
  - "Откройте папку «Отправленные», найдите старые письма с крупными вложениями и переместите ненужные сообщения в «Удалённые», после чего проверьте обновившийся размер ящика."
escalate_if: "Обратитесь в техподдержку, если почта остаётся переполненной после освобождения места или нужные письма нельзя переместить в «Удалённые»."
