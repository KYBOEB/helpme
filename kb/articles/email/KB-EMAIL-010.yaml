id: KB-EMAIL-010
category: корпоративная почта
title: Не работает автоответчик об отпуске
symptoms:
  - "нужен автоответ на время отпуска"
  - "автоответчик не срабатывает"
  - "как включить ответ об отсутствии"
steps:
  - "Откройте корпоративную почту в браузере, нажмите «Настройки» и найдите раздел «Автоматические ответы» или «Ответ об отсутствии» — откроется форма настройки автоответчика."
  - "В форме автоматических ответов включите переключатель «Включить автоответ» и укажите даты начала и окончания отпуска — система покажет сохранённые параметры периода."
  - "Введите текст ответа в поле сообщения и нажмите «Сохранить» или «Применить» — появится уведомление о сохранении, а автоответчик будет включён."
  - "Отправьте на свой адрес пробное письмо с другой почты после сохранения настроек — в отправленном сообщении или ответе будет видно, сработал ли автоответчик."
escalate_if: "Обратитесь в техподдержку, если настройки сохраняются, но отправитель не получает автоответ или раздел автоматических ответов отсутствует."
