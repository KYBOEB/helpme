id: KB-EMAIL-005
category: корпоративная почта
title: Не приходят письма от внешних адресатов
symptoms:
  - "не приходят письма от клиентов"
  - "внешние письма не доходят"
  - "письма от партнёров не приходят"
  - "не получаю письма с gmail"
  - "почта не принимает внешние письма"
required_slots:
  - key: where
    question: "Проверяли ли папку «Спам»?"
    options: ["Да, там пусто", "Нет, ещё не смотрел", "Письма есть в спаме"]
steps:
  - "Откройте папку «Спам» в почтовом приложении или веб-версии почты — письмо от внешнего отправителя может находиться там вместо папки «Входящие»."
  - "Откройте веб-версию почты и найдите папку «Карантин», если она отображается в меню — в ней могут быть задержанные внешние письма."
  - "Попросите отправителя проверить ваш адрес в поле получателя — при опечатке письмо не попадёт в вашу учётную запись."
  - "Попросите отправителя отправить письмо ещё раз и проверить сообщение об ошибке доставки — по нему можно понять, на каком этапе письмо не прошло."
  - "Войдите в почту через веб-браузер и проверьте папку «Входящие» — если письмо есть там, проблема связана с почтовым приложением или его синхронизацией."
escalate_if: "Обратитесь в техподдержку, если внешние письма не находятся в папках почты и отправители получают ошибки доставки."
