id: KB-EMAIL-005
category: корпоративная почта
title: Не приходят письма от внешних адресатов
symptoms:
  - "не приходят письма от клиентов"
  - "внешние письма не доходят"
  - "письма от партнёров не приходят"
  - "не получаю письма с gmail"
  - "почта не принимает внешние письма"
required_slots:
  - key: where
    question: "Проверяли ли папку «Спам»?"
    options: ["Да, там пусто", "Нет, ещё не смотрел", "Письма есть в спаме"]
steps:
  - "Проверьте папку «Спам» — внешние письма часто попадают туда"
  - "Проверьте папку «Карантин», если она есть в веб-версии почты"
  - "Попросите отправителя проверить адрес — возможно, опечатка"
  - "Попросите отправителя повторить письмо и уточнить, нет ли ошибки доставки у него"
  - "Откройте веб-версию почты и проверьте, пришло ли письмо туда"
escalate_if: "внешние письма не приходят ни в веб-версию, ни в клиент"