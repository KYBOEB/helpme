id: KB-EMAIL-015
category: корпоративная почта
title: Не работает поиск по письмам
symptoms:
  - "поиск в почте ничего не находит"
  - "не ищет старые письма"
  - "поиск по ящику не работает"
steps:
  - "Введите в строку поиска почты короткое слово или адрес отправителя без дополнительных условий, чтобы проверить, появляются ли хотя бы отдельные найденные письма."
  - "Откройте область дополнительных параметров поиска рядом со строкой поиска и выберите «Вся почта» или аналогичный пункт, чтобы поиск охватывал не только текущую папку."
  - "Откройте папку «Входящие» и вручную найдите одно старое письмо за нужную дату, чтобы проверить, загружены ли старые сообщения в почтовый ящик."
  - "Закройте почтовую программу, снова откройте её и повторите поиск, чтобы проверить, исчезла ли временная ошибка поиска."
  - "Откройте почту на странице входа в корпоративную учётную запись и выполните тот же поиск, чтобы понять, связана ли проблема с программой на компьютере."
escalate_if: "Обратитесь в техподдержку, если поиск не находит письма ни в программе, ни на странице входа, хотя нужные письма видны в папках."
