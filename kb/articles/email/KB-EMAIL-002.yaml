id: KB-EMAIL-002
category: корпоративная почта
title: Не настроена почта на телефоне
symptoms:
  - "не могу настроить почту на телефоне"
  - "почта на айфоне не работает"
  - "как добавить корпоративную почту на телефон"
  - "почтовый клиент на смартфоне не подключается"
  - "настроить email на android"
required_slots:
  - key: os
    question: "Какая у вас операционная система на телефоне?"
    options: ["Android", "iOS"]
steps:
  - "Установите официальный почтовый клиент из магазина приложений"
  - "Добавьте учётную запись, выберите тип «Exchange» или «Корпоративная»"
  - "Введите корпоративный email и пароль"
  - "Разрешите приложению доступ к почте и календарю"
  - "Отправьте тестовое письмо себе и проверьте, что оно пришло"
escalate_if: "после настройки почта не синхронизируется"