id: KB-EMAIL-002
category: корпоративная почта
title: Не настроена почта на телефоне
symptoms:
  - "не могу настроить почту на телефоне"
  - "почта на айфоне не работает"
  - "как добавить корпоративную почту на телефон"
  - "почтовый клиент на смартфоне не подключается"
  - "настроить email на android"
required_slots:
  - key: os
    question: "Какая у вас операционная система на телефоне?"
    options: ["Android", "iOS"]
steps:
  - "Откройте магазин приложений на телефоне и установите официальный почтовый клиент, указанный как приложение проверенного разработчика, чтобы безопасно добавить корпоративную почту."
  - "Запустите почтовый клиент и выберите «Добавить учётную запись», затем укажите тип «Exchange» или «Корпоративная», после чего появятся поля для рабочих данных."
  - "Введите корпоративный адрес и пароль в полях учётной записи, чтобы приложение начало подключение к почтовому серверу."
  - "Подтвердите запросы приложения на доступ к почте и календарю в окне разрешений, чтобы сообщения и события могли синхронизироваться."
  - "Создайте письмо себе в почтовом клиенте и отправьте его, после чего проверьте входящие, чтобы убедиться, что настройка работает."
escalate_if: "Обратитесь в техподдержку, если приложение не принимает учётные данные или не подключается после выдачи разрешений."
