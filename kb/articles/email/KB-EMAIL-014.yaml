id: KB-EMAIL-014
category: корпоративная почта
title: Нужна общая почта отдела или рассылка
symptoms:
  - "нужен общий ящик"
  - "как сделать рассылку на отдел"
  - "нужен адрес для всей группы"
steps:
  - "Откройте корпоративную почту и адресную книгу в поле «Кому», найдите название отдела или группы и проверьте, существует ли уже общий адрес или рассылка."
  - "Создайте тестовое письмо без отправки и добавьте найденный адрес в поле «Кому», чтобы увидеть название группы и список доступных получателей, если он отображается."
  - "Подготовьте для обращения в техподдержку название отдела, назначение общего адреса или рассылки и список сотрудников, которым нужен доступ, чтобы специалист мог оформить подходящий вариант."
escalate_if: "Обратитесь в техподдержку, если нужного адреса нет или вам требуется создать, изменить или закрыть общую почту."
