id: KB-EMAIL-013
category: корпоративная почта
title: Почтовый клиент пишет «неверный пароль»
symptoms:
  - "программа почты не принимает пароль"
  - "в браузере заходит, в клиенте нет"
  - "outlook просит пароль постоянно"
steps:
  - "Проверьте раскладку клавиатуры и состояние клавиши Caps Lock перед вводом пароля в почтовой программе — пароль будет введён в правильном регистре и на нужном языке."
  - "Откройте в браузере страницу входа в корпоративную учётную запись и вручную введите тот же пароль — успешный вход подтвердит, что пароль действителен."
  - "Откройте в почтовой программе раздел «Настройки» или «Параметры учётной записи» и выберите корпоративный адрес — появится состояние учётной записи и запрос на повторный вход, если программе нужен пароль."
  - "Нажмите «Войти» или «Изменить пароль» в окне учётной записи и заново введите действующий пароль — программа подтвердит вход или покажет точное сообщение об ошибке."
  - "Если пароль недавно менялся, обновите его в окне входа почтовой программы — после успешной проверки постоянные запросы пароля должны прекратиться."
escalate_if: "Обратитесь в техподдержку, если пароль принимается в браузере, но почтовая программа продолжает показывать ошибку или постоянно запрашивает его."
