id: KB-EMAIL-009
category: корпоративная почта
title: Нужно настроить подпись в письмах
symptoms:
  - "как поставить подпись"
  - "нужна корпоративная подпись"
  - "подпись не подставляется"
steps:
  - "Откройте настройки веб-почты через значок шестерёнки и найдите раздел «Подпись» — появится поле для ввода текста подписи."
  - "Введите нужные данные в поле «Подпись» — пример подписи отобразится в редакторе и будет доступен для сохранения."
  - "Выберите подпись по умолчанию для новых писем и ответов в настройках подписи — веб-почта будет подставлять её в соответствующие сообщения."
  - "Нажмите «Сохранить» в настройках и откройте окно нового письма — подпись появится в области текста сообщения."
escalate_if: "Обратитесь в техподдержку, если раздела «Подпись» нет или сохранённая подпись не появляется в новых письмах и ответах."
