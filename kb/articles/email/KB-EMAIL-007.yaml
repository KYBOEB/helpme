id: KB-EMAIL-007
category: корпоративная почта
title: Письма попадают в спам у получателя
symptoms:
  - "мои письма уходят в спам"
  - "адресат не получает письма, они в нежелательных"
  - "письма помечаются как спам"
steps:
  - "Попросите получателя проверить папку «Спам» или «Нежелательная почта» — там может находиться письмо, которое не попало во «Входящие»."
  - "Попросите получателя отметить найденное письмо как «Не спам» в его почтовой программе — следующие письма с вашего адреса могут начать попадать во «Входящие»."
  - "Отправьте короткое тестовое письмо без вложений и большого количества ссылок из обычного окна создания письма — результат покажет, связано ли попадание в спам с содержимым исходного сообщения."
  - "Проверьте адрес получателя в поле «Кому» перед повторной отправкой — письмо уйдёт на нужный адрес, а не в похожий или ошибочно введённый."
escalate_if: "Обратитесь в техподдержку, если письма попадают в спам у нескольких получателей даже после проверки адреса и отправки простого тестового сообщения."
