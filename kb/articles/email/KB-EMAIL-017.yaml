id: KB-EMAIL-017
category: корпоративная почта
title: Не приходят письма и рассылки от корпоративных сервисов
symptoms:
  - "не приходят уведомления от систем"
  - "перестали приходить рассылки"
  - "не получаю письма от сервиса"
  - "коллеги получают рассылку, а я нет"
  - "не приходят оповещения о новых материалах"
steps:
  - "Загляните в папку «Спам» и «Нежелательная почта»: если письма там, отметьте одно из них как «Не спам» — следующие пойдут во «Входящие»"
  - "Проверьте правила обработки почты в настройках ящика: правило, созданное когда-то для порядка, могло начать раскладывать эти письма в архив или сразу удалять"
  - "Посмотрите в личном кабинете сервиса, на какой адрес оформлена подписка на уведомления — часто она осталась на старом адресе после смены фамилии или подразделения"
  - "Убедитесь, что подписка на рассылку включена: в большинстве систем её можно случайно отключить одной ссылкой «отписаться» внизу письма"
  - "Попросите коллегу переслать вам одно такое письмо: если пересланное доходит, а прямое нет — дело в фильтрах на вашей стороне"
escalate_if: "письма не приходят ни во «Входящие», ни в «Спам», и подписка оформлена на верный адрес"
