id: KB-WORKPLACE-009
category: рабочее место
title: Компьютер долго включается
symptoms:
  - "включается пять минут"
  - "загрузка очень долгая"
  - "комп грузится вечность"
steps:
  - "Отключите от компьютера ненужные флешки, внешние диски и другие USB-устройства перед включением, чтобы проверить, сократится ли время загрузки."
  - "Откройте «Диспетчер задач» через меню «Пуск», перейдите на вкладку «Автозагрузка» и отключите только незнакомые или ненужные программы, после чего они не будут запускаться вместе с Windows."
  - "Откройте «Параметры» через меню «Пуск», выберите «Windows Update» и нажмите «Проверить наличие обновлений», чтобы система показала доступные исправления."
  - "Перезагрузите компьютер через меню «Пуск» и «Питание», чтобы проверить, стало ли включение быстрее после применения обновлений."
escalate_if: "Обратитесь в техподдержку, если компьютер продолжает включаться несколько минут или зависает на одном экране."
