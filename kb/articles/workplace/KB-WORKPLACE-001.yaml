id: KB-WORKPLACE-001
category: рабочее место
title: Компьютер не включается
symptoms:
  - "комп не включается"
  - "пк не врубается"
  - "не запускается компьютер"
  - "нажимаю кнопку питания ничего не происходит"
  - "ноутбук не включается"
required_slots:
  - key: power
    question: "Есть ли реакция на кнопку питания?"
    options: ["Ничего не происходит", "Кулеры шумят, но экран чёрный", "Индикатор мигает"]
steps:
  - "Проверьте кабель питания у розетки и у системного блока или зарядного устройства ноутбука — после плотного подключения должен загореться индикатор питания или зарядки."
  - "Подключите компьютер к другой розетке или используйте другой подходящий кабель питания — если проблема была в электропитании, компьютер подаст признаки работы."
  - "Если у вас ноутбук, подключите зарядное устройство и оставьте его на десять минут, наблюдая за индикатором зарядки — аккумулятор начнёт заряжаться, если зарядка исправна."
  - "Удерживайте кнопку питания на корпусе компьютера или ноутбука десять секунд, отпустите её и нажмите ещё раз — устройство должно начать запуск."
  - "Если компьютер включается, но на мониторе нет изображения, включите монитор и проверьте кабель в разъёме видеокарты на компьютере — на экране должно появиться изображение с выбранного входа."
escalate_if: "Обратитесь в техподдержку, если нет индикаторов питания и реакции после проверки розетки, кабеля и кнопки питания."
