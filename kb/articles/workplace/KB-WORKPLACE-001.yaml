id: KB-WORKPLACE-001
category: рабочее место
title: Компьютер не включается
symptoms:
  - "комп не включается"
  - "пк не врубается"
  - "не запускается компьютер"
  - "нажимаю кнопку питания ничего не происходит"
  - "ноутбук не включается"
required_slots:
  - key: power
    question: "Есть ли реакция на кнопку питания?"
    options: ["Ничего не происходит", "Кулеры шумят, но экран чёрный", "Индикатор мигает"]
steps:
  - "Проверьте, что кабель питания подключён к розетке и к блоку"
  - "Попробуйте другую розетку или другой кабель питания"
  - "На ноутбуке: подключите зарядку и подождите 10 минут"
  - "Зажмите кнопку питания на 10 секунд, отпустите и нажмите снова"
  - "Проверьте, что монитор включён в правильный порт видеокарты"
escalate_if: "после проверки питания компьютер не реагирует на кнопку"