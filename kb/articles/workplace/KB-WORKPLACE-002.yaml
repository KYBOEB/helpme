id: KB-WORKPLACE-002
category: рабочее место
title: Чёрный экран при включённом компьютере
symptoms:
  - "черный экран"
  - "комп работает а экран черный"
  - "монитор не показывает изображение"
  - "пк шумит но экрана нет"
  - "чёрный экран после включения"
required_slots:
  - key: indicator
    question: "Горит ли индикатор питания на мониторе?"
    options: ["Горит", "Не горит", "Мигает"]
steps:
  - "Проверьте, что монитор включён в розетку и кнопка питания нажата"
  - "Проверьте кабель между монитором и системным блоком — плотно ли он вставлен"
  - "Переключите источник сигнала на мониторе (HDMI / DisplayPort / VGA)"
  - "Подключите монитор к другому компьютеру — проверьте, работает ли он"
  - "Перезагрузите компьютер, зажав кнопку питания на 10 секунд"
escalate_if: "монитор не показывает изображение даже на другом компьютере"