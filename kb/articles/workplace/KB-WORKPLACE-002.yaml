id: KB-WORKPLACE-002
category: рабочее место
title: Чёрный экран при включённом компьютере
symptoms:
  - "черный экран"
  - "комп работает а экран черный"
  - "монитор не показывает изображение"
  - "пк шумит но экрана нет"
  - "чёрный экран после включения"
required_slots:
  - key: indicator
    question: "Горит ли индикатор питания на мониторе?"
    options: ["Горит", "Не горит", "Мигает"]
steps:
  - "Проверьте, подключён ли монитор к розетке, и нажмите кнопку питания на его корпусе — индикатор питания должен загореться."
  - "Проверьте кабель между монитором и системным блоком, плотно вставив его с обеих сторон — кабель не должен шататься или выпадать из разъёма."
  - "Нажмите на мониторе кнопку «Источник» или «Input» и выберите используемый разъём, например «HDMI», «DisplayPort» или «VGA» — на экране должно появиться изображение с компьютера."
  - "Подключите монитор к другому компьютеру тем же кабелем — если изображение появится, проблема, скорее всего, связана с исходным компьютером или его разъёмом."
  - "Если компьютер не реагирует на обычное выключение, удерживайте его кнопку питания около 10 секунд — компьютер полностью выключится, после чего его можно включить снова."
escalate_if: "Обратитесь в техподдержку, если индикатор монитора не загорается или изображение не появляется после проверки кабеля и источника сигнала."
