id: KB-WORKPLACE-005
category: рабочее место
title: Синий экран при загрузке компьютера
symptoms:
  - "синий экран"
  - "bsod"
  - "комп выдает синий экран"
  - "синий экран смерти"
  - "после включения синий экран и перезагрузка"
steps:
  - "Запишите код и текст ошибки с синего экрана или сфотографируйте его телефоном — по этим данным можно определить причину сбоя."
  - "Отключите от компьютера внешние устройства, кроме клавиатуры, мыши и питания, и снова включите его — если синий экран исчезнет, причиной могло быть одно из отключённых устройств."
  - "Если появится экран «Автоматическое восстановление», выберите «Дополнительные параметры», затем «Поиск и устранение неисправностей» и «Восстановление при загрузке» — Windows проверит запуск системы и попробует исправить найденные проблемы."
  - "Если Windows запустится, откройте «Параметры», выберите «Центр обновления Windows» и нажмите «Проверить наличие обновлений» — система покажет доступные обновления, которые могут исправить сбой."
escalate_if: "Обратитесь в техподдержку, если синий экран повторяется, Windows не запускается или на экране появляется код ошибки, который не удаётся устранить восстановлением при загрузке."
