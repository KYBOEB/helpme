id: KB-WORKPLACE-007
category: рабочее место
title: Компьютер перезагружается сам
symptoms:
  - "комп перезагружается без причины"
  - "сам выключается во время работы"
  - "внезапная перезагрузка"
steps:
  - "Сохраните открытые документы и закройте программы обычным способом — при внезапной перезагрузке вы не потеряете последние изменения."
  - "Проверьте кабель питания и подключение зарядного устройства у компьютера — значок батареи должен показывать, что устройство заряжается или работает от сети."
  - "Откройте «Параметры», выберите «Windows Update» и нажмите «Проверить наличие обновлений» — система покажет доступные обновления или сообщение, что всё обновлено."
  - "Освободите вентиляционные отверстия компьютера, поставив его на твёрдую ровную поверхность — корпус не будет перекрывать доступ воздуха, а шум вентилятора может уменьшиться."
  - "Откройте «Просмотр событий» через поиск в меню «Пуск» и выберите раздел «Система» — в списке появятся записи о времени перезагрузки и возможных ошибках."
escalate_if: "Обратитесь в техподдержку, если компьютер перезагружается снова, сильно нагревается, выключается с запахом или не успевает сохранить работу."
