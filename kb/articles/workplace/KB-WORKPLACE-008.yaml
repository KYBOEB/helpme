id: KB-WORKPLACE-008
category: рабочее место
title: Пропал звук после обновления
symptoms:
  - "после обновления нет звука"
  - "звук исчез сам"
  - "динамики перестали работать"
steps:
  - "Нажмите значок громкости в правом нижнем углу рабочего стола, выберите нужные динамики в списке устройств вывода и убедитесь, что звук появился."
  - "Откройте «Параметры» через меню «Пуск», выберите «Система» и «Звук», а затем запустите средство устранения неполадок, после чего Windows покажет найденную причину или предложит исправление."
  - "Откройте «Диспетчер устройств» через поиск Windows, раскройте раздел «Звуковые, игровые и видеоустройства» и в свойствах аудиоустройства выберите «Откатить драйвер», если кнопка доступна, после чего вернётся предыдущая версия драйвера."
  - "Перезагрузите компьютер через меню «Пуск» и «Питание», чтобы обновлённый аудиодрайвер загрузился заново и система повторно определила динамики."
escalate_if: "Обратитесь в техподдержку, если звук не появился после этих действий или аудиоустройство отсутствует в «Диспетчере устройств»."
