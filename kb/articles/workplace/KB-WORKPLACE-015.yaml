id: KB-WORKPLACE-015
category: рабочее место
title: Нужно перенести рабочее место в другой кабинет
symptoms:
  - "переезжаю в другой кабинет"
  - "нужно перевезти компьютер"
  - "перенос рабочего места"
steps:
  - "Сохраните открытые документы через меню «Файл» и выберите «Сохранить», после чего убедитесь, что документы закрылись без сообщений об ошибке — рабочие данные останутся сохранёнными перед переносом."
  - "Выключите компьютер через меню «Пуск», затем «Питание» и «Завершение работы» — экран погаснет, а компьютер полностью остановит работу."
  - "Перед отсоединением сфотографируйте подключение кабелей с задней стороны компьютера и монитора — фотография поможет подключить оборудование в новом кабинете так же, как раньше."
  - "Отсоедините кабели от выключенного оборудования и перенесите компьютер, монитор и остальные устройства в новый кабинет — оборудование будет готово к повторному подключению без работающего питания."
  - "Подключите кабели по фотографии, включите компьютер кнопкой питания и проверьте сеть, монитор и клавиатуру — рабочее место должно запуститься с прежними устройствами и подключением."
escalate_if: "Обратитесь в техподдержку, если после переноса не работает сеть, монитор, док-станция или часть оборудования."
