id: KB-WORKPLACE-013
category: рабочее место
title: Экран заблокирован и не принимает пароль
symptoms:
  - "не могу разблокировать компьютер"
  - "экран блокировки не пускает"
  - "пароль на входе не подходит"
steps:
  - "На экране блокировки нажмите на обозначение языка в правом нижнем углу и выберите раскладку, на которой задан пароль — после этого введённые символы будут распознаваться правильно."
  - "Проверьте клавиши Caps Lock и Num Lock на клавиатуре и повторно введите пароль в поле входа — на экране появится сообщение о входе или уточнении пароля."
  - "Нажмите «Другой пользователь» или выберите свою учётную запись на экране блокировки и введите пароль ещё раз — компьютер проверит вход именно для выбранной учётной записи."
  - "Нажмите значок питания в правом нижнем углу экрана блокировки и выберите «Перезагрузка» — после запуска появится новый экран входа, на котором можно повторить попытку."
escalate_if: "Обратитесь в техподдержку, если правильный пароль не принимается после проверки раскладки, учётной записи и перезагрузки."
