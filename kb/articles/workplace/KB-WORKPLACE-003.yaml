id: KB-WORKPLACE-003
category: рабочее место
title: Компьютер сильно тормозит
symptoms:
  - "комп тормозит"
  - "пк медленно работает"
  - "компьютер виснет"
  - "всё лагает"
  - "ноутбук стал очень медленным"
steps:
  - "Откройте диспетчер задач и посмотрите, какая программа грузит процессор и память"
  - "Закройте лишние вкладки браузера и неиспользуемые программы"
  - "Перезагрузите компьютер"
  - "Проверьте свободное место на диске — должно быть не менее 10%"
  - "Очистите временные файлы через встроенную утилиту «Очистка диска»"
escalate_if: "после перезагрузки и очистки компьютер продолжает тормозить"