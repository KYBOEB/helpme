id: KB-WORKPLACE-003
category: рабочее место
title: Компьютер сильно тормозит
symptoms:
  - "комп тормозит"
  - "пк медленно работает"
  - "компьютер виснет"
  - "всё лагает"
  - "ноутбук стал очень медленным"
steps:
  - "На Windows нажмите сочетание клавиш Ctrl+Shift+Esc, откройте «Диспетчер задач» и посмотрите вкладки «Процессы» и «Производительность» — будет видно, какая программа сильнее всего загружает процессор, память или диск."
  - "Закройте лишние вкладки браузера через кнопку закрытия вкладки и завершите неиспользуемые программы обычным способом — загрузка памяти и процессора должна уменьшиться, а работа компьютера стать быстрее."
  - "Перезагрузите компьютер через меню «Пуск» и пункт «Питание» — после повторного входа откроется рабочий стол с заново запущенными системными службами."
  - "Откройте «Проводник», выберите «Этот компьютер» и проверьте свободное место на системном диске — свободного пространства должно быть не меньше 10 процентов."
  - "Откройте меню «Пуск», найдите встроенную утилиту «Очистка диска» и просмотрите доступные временные файлы — программа покажет, сколько места можно освободить без изменения личных документов."
escalate_if: "Обратитесь в техподдержку, если компьютер продолжает зависать после перезагрузки или в «Диспетчере задач» постоянно отображается высокая загрузка системных ресурсов."
