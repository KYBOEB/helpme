id: KB-WORKPLACE-012
category: рабочее место
title: Пропали файлы с рабочего стола
symptoms:
  - "исчезли ярлыки и документы"
  - "рабочий стол пустой"
  - "пропали файлы после перезагрузки"
steps:
  - "Щёлкните правой кнопкой мыши по свободному месту рабочего стола, откройте «Вид» и включите «Отображать значки рабочего стола» — ярлыки и файлы снова появятся, если они были только скрыты."
  - "Откройте «Проводник» через значок папки на панели задач и выберите слева папку «Рабочий стол» — вы увидите файлы, которые находятся на рабочем столе текущей учётной записи."
  - "Откройте «Корзину» с рабочего стола, найдите пропавший файл, щёлкните по нему правой кнопкой мыши и выберите «Восстановить» — файл вернётся в прежнюю папку."
  - "Откройте поиск Windows через меню «Пуск», введите имя пропавшего файла или папки и просмотрите найденные результаты — система покажет объект, если он сохранился в другом месте."
escalate_if: "Обратитесь в техподдержку, если файлы не находятся в папке «Рабочий стол», «Корзине» или через поиск."
