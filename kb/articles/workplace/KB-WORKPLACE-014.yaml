id: KB-WORKPLACE-014
category: рабочее место
title: Нужна настройка нового компьютера
symptoms:
  - "выдали новый компьютер, нужна настройка"
  - "как подготовить рабочее место"
  - "новый ноутбук, что сделать"
steps:
  - "Подключите компьютер к зарядному устройству и к доступной сети Wi-Fi через значок сети в правом нижнем углу экрана — устройство получит питание и подключение для дальнейшей настройки."
  - "Войдите на странице входа в корпоративную учётную запись под своими рабочими данными — откроется рабочий стол с вашим профилем."
  - "Откройте «Параметры» через меню «Пуск», выберите «Центр обновления Windows» и нажмите «Проверить наличие обновлений» — система покажет доступные обновления и их состояние."
  - "Откройте приложение для установки разрешённых рабочих программ или обратитесь к техподдержке за их установкой — необходимые приложения появятся в меню «Пуск» после завершения установки."
  - "Откройте нужные рабочие программы через меню «Пуск» и проверьте вход в них — вы увидите, какие программы уже готовы к работе, а какие требуют дополнительной настройки."
escalate_if: "Обратитесь в техподдержку, если компьютер не подключается к сети, не принимает рабочую учётную запись или на нём отсутствуют необходимые программы."
