id: KB-WORKPLACE-011
category: рабочее место
title: Не работает интернет по проводу
symptoms:
  - "по кабелю интернета нет"
  - "витая пара не работает"
  - "провод воткнут, сети нет"
steps:
  - "Плотно вставьте сетевой кабель в разъём компьютера и розетку или сетевое устройство, чтобы возле разъёма загорелся или начал мигать индикатор соединения."
  - "Откройте «Параметры» через меню «Пуск», выберите «Сеть и Интернет» и «Ethernet», чтобы проверить, видит ли компьютер проводное подключение."
  - "Запустите средство устранения неполадок в разделе «Сеть и Интернет» приложения «Параметры», чтобы Windows проверила кабель, сетевой адаптер и настройки подключения."
  - "Откройте «Дополнительные сетевые параметры» в разделе «Сеть и Интернет», выберите «Ethernet» и нажмите «Включить», если проводной адаптер отключён, после чего статус подключения должен измениться."
escalate_if: "Обратитесь в техподдержку, если индикатор на разъёме не загорается или проводная сеть не появляется после проверки кабеля и адаптера."
