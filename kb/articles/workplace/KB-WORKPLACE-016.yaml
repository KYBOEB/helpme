id: KB-WORKPLACE-016
category: рабочее место
title: Изображение на мониторе мутное или растянутое
symptoms:
  - "картинка размытая"
  - "всё растянуто по экрану"
  - "неправильное разрешение экрана"
steps:
  - "Щёлкните правой кнопкой мыши по свободному месту рабочего стола и выберите «Параметры экрана» — откроется окно с настройками изображения подключённого монитора."
  - "В разделе «Масштаб и разметка» откройте список «Разрешение экрана» и выберите значение с пометкой «Рекомендуется» — изображение должно стать чётким и соответствовать пропорциям экрана."
  - "В том же разделе откройте список «Масштаб» и выберите значение с пометкой «Рекомендуется» — размер текста и значков изменится без растягивания изображения."
  - "Нажмите кнопки управления на корпусе монитора, откройте его меню и запустите «Автонастройку» или «Auto Adjust» — монитор заново выровняет изображение, если он подключён аналоговым кабелем."
  - "Выключите компьютер и монитор, выньте кабель изображения с обеих сторон и подключите его обратно до упора — после включения проверьте, исчезли ли размытость и растяжение."
escalate_if: "Обратитесь в техподдержку, если рекомендуемое разрешение не отображается или изображение остаётся мутным после проверки настроек и кабеля."
