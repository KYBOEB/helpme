id: KB-WORKPLACE-006
category: рабочее место
title: Не переключается язык ввода
symptoms:
  - "не меняется раскладка"
  - "залипла английская клавиатура"
  - "не переключается на русский"
steps:
  - "Нажмите сочетание клавиш «Alt+Shift» или «Windows+Пробел» в любом поле для ввода текста — на панели задач появится другая раскладка, например «RU» или «EN»."
  - "Нажмите обозначение языка в правой части панели задач Windows — откроется список доступных раскладок, среди которых можно выбрать русский язык."
  - "Выберите «Русский» в списке языков на панели задач — обозначение языка изменится на «RU», и текст начнёт вводиться кириллицей."
  - "Откройте «Параметры», выберите «Время и язык», а затем «Ввод» и «Дополнительные параметры клавиатуры» — вы увидите настройки сочетания клавиш и сможете проверить, назначено ли переключение раскладки."
  - "Перезагрузите компьютер через меню «Пуск» и команду «Питание» — после запуска выбранные языки и сочетание клавиш загрузятся заново."
escalate_if: "Обратитесь в техподдержку, если русский язык отсутствует в списке или раскладка не переключается после перезагрузки."
