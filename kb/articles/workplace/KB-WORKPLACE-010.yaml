id: KB-WORKPLACE-010
category: рабочее место
title: Закончилось место на диске
symptoms:
  - "нет места на диске"
  - "диск с заполнен"
  - "пишет недостаточно места"
steps:
  - "Откройте «Параметры» через меню «Пуск», выберите «Система» и «Память», чтобы увидеть, какой диск и какие категории занимают свободное место."
  - "Откройте «Проводник» через панель задач, выберите нужный диск и отсортируйте его содержимое по размеру, чтобы найти самые большие файлы и папки."
  - "Поставьте на паузу текущие загрузки и синхронизацию в используемых программах, чтобы новые файлы временно не занимали оставшееся место."
  - "Переместите проверенные личные файлы с системного диска на разрешённое внешнее или сетевое хранилище, чтобы после проверки копий на диске освободилось место."
escalate_if: "Обратитесь в техподдержку, если свободного места почти не осталось или вы не уверены, какие файлы можно переместить."
