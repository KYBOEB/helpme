id: KB-WORKPLACE-004
category: рабочее место
title: Не работает удалённый доступ к рабочему компьютеру
symptoms:
  - "не могу подключиться к рабочему пк из дома"
  - "удаленка не работает"
  - "rdp не подключается"
  - "не работает удаленный рабочий стол"
  - "не пускает на рабочий компьютер удаленно"
required_slots:
  - key: network
    question: "Откуда пытаетесь подключиться?"
    options: ["Из дома", "Из другого офиса", "С мобильного интернета"]
steps:
  - "Подключитесь к корпоративному VPN"
  - "Проверьте, что рабочий компьютер включён и не в спящем режиме"
  - "Откройте клиент удалённого рабочего стола и введите адрес компьютера"
  - "Введите корпоративный логин и пароль"
  - "Если не подключается — попробуйте перезапустить VPN и повторить"
escalate_if: "удалённое подключение не работает даже через VPN"