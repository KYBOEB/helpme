id: KB-WORKPLACE-004
category: рабочее место
title: Не работает удалённый доступ к рабочему компьютеру
symptoms:
  - "не могу подключиться к рабочему пк из дома"
  - "удаленка не работает"
  - "rdp не подключается"
  - "не работает удаленный рабочий стол"
  - "не пускает на рабочий компьютер удаленно"
required_slots:
  - key: network
    question: "Откуда пытаетесь подключиться?"
    options: ["Из дома", "Из другого офиса", "С мобильного интернета"]
steps:
  - "Откройте программу корпоративного VPN и нажмите «Подключиться» — после успешного подключения появится статус «Подключено» или аналогичное сообщение."
  - "Убедитесь, что рабочий компьютер включён и не находится в спящем режиме, попросив человека рядом проверить его экран или индикатор питания — компьютер должен быть доступен для подключения."
  - "Откройте приложение «Подключение к удалённому рабочему столу» через меню «Пуск» и введите адрес рабочего компьютера в поле «Компьютер» — после нажатия «Подключить» появится окно входа."
  - "Введите корпоративный логин и пароль в окне удалённого рабочего стола — при правильных данных откроется рабочий стол удалённого компьютера."
  - "Если подключение не установилось, откройте программу VPN, нажмите «Отключиться», затем снова нажмите «Подключиться» и повторите вход в удалённый рабочий стол — программа должна заново установить защищённое соединение."
escalate_if: "Обратитесь в техподдержку, если VPN подключён, рабочий компьютер включён, но удалённый рабочий стол сообщает об ошибке или не принимает корпоративные данные."
