# ============================================================
# Группа 7: ДЛИННЫЕ РЕАЛЬНЫЕ (10) — как реально пишут в поддержку
# ============================================================
- id: T-31
  text: >
    Добрый день. Сижу дома на удалёнке, с утра не могу подключиться к корпоративному VPN.
    Приложение запускается, ввожу логин и пароль, но выдаёт ошибку сертификата. Вчера
    всё работало. Ноутбук корпоративный, Windows 11. Что делать?
  expect_category: "VPN"
  group: "длинные реальные"

- id: T-32
  text: >
    Здравствуйте! У меня проблема с почтой. Outlook не отправляет письма, они висят
    в исходящих и никуда не уходят. Интернет есть, сайты открываются. Размер вложения
    небольшой, обычный docx. Помогите пожалуйста, срочно нужно отправить отчёт.
  expect_category: "корпоративная почта"
  group: "длинные реальные"

- id: T-33
  text: >
    Привет. Не могу войти в учётную запись, пишет что пароль неверный. Пароль точно
    правильный, я его не менял. Пробовал несколько раз, теперь пишет что учётная
    запись заблокирована. Что мне сделать, чтобы разблокировали?
  expect_category: "доступы"
  group: "длинные реальные"

- id: T-34
  text: >
    Коллеги, помогите. С утра пришёл в офис, ноутбук не подключается к corp-wifi.
    Сеть вижу в списке, ввожу пароль, он его принимает, но интернета нет. У соседа
    всё работает. Что может быть?
  expect_category: "Wi-Fi"
  group: "длинные реальные"

- id: T-35
  text: >
    Добрый день. У меня перестал работать принтер в кабинете 412. Отправляю документ
    на печать, задание появляется в очереди и через секунду исчезает. Принтер горит,
    бумага есть. Что можно сделать?
  expect_category: "оборудование"
  group: "длинные реальные"

- id: T-36
  text: >
    Здравствуйте. Помогите, пожалуйста. Компьютер стал очень сильно тормозить,
    открываю любую программу — она запускается несколько минут. В диспетчере задач
    вижу, что загрузка памяти почти 100%. Перезагружал, не помогает. Что делать?
  expect_category: "рабочее место"
  group: "длинные реальные"

- id: T-37
  text: >
    Приветствую. Нужна помощь с установкой программы. Руководитель попросил поставить
    Adobe Acrobat для работы с PDF. Раньше стоял, но после переустановки системы
    пропал. Как мне его правильно поставить, чтобы всё было по правилам?
  expect_category: "программное обеспечение"
  group: "длинные реальные"

- id: T-38
  text: >
    Добрый день! Не могу подключиться к VPN с телефона. На ноутбуке всё работает,
    а на айфоне приложение выдаёт ошибку при подключении. Уже переустанавливал,
    не помогло. Работаю в командировке, очень нужно попасть в корпоративную сеть.
  expect_category: "VPN"
  group: "длинные реальные"

- id: T-39
  text: >
    Здравствуйте. У меня проблема с мышью, беспроводная Logitech перестала работать.
    Поменял батарейки, не помогло. Курсор вообще не двигается. USB-приёмник вставлен,
    компьютер его видит. Что можно попробовать?
  expect_category: "оборудование"
  group: "длинные реальные"

- id: T-40
  text: >
    Привет. Такая ситуация — нужно получить доступ к сетевой папке отдела финансов.
    Раньше доступ был, сейчас пишет «отказано в доступе». Я в офисе, к сети подключён,
    VPN не нужен. Как восстановить доступ, к кому обратиться?
  expect_category: "доступы"
  group: "длинные реальные"